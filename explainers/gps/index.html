<!doctype html><meta charset=utf-8><style>@font-face{font-family:Montserrat;font-weight:800;src:url(assets/montserrat-latin-800-normal.woff2)}html,body{margin:0;background:#000}canvas{display:block}</style>
<canvas id=c width=1920 height=1080></canvas>
<script src=data.js></script><script src=lib.js></script><script src=scenes.js></script><script src=timeline.js></script>
<script>
cx=document.getElementById('c').getContext('2d');
const acc=document.createElement('canvas');acc.width=W;acc.height=H;const ax=acc.getContext('2d');
window.END=END;window.EV=[];window.READY=false;
window.seek=t=>{drawFrame(t)};
// motion blur: n subframes spread over `span` seconds ending at t
window.blur=(t,n=6,span=1/120)=>{for(let i=0;i<n;i++){drawFrame(t-span+span*(i+.5)/n);ax.globalAlpha=1/(i+1);if(i==0)ax.globalAlpha=1;ax.drawImage(cx.canvas,0,0)}
  cx.setTransform(1,0,0,1,0,0);cx.globalAlpha=1;cx.drawImage(acc,0,0)};
document.fonts.load('800 40px Montserrat').then(()=>{
  REC=true;SH.forEach(s=>{EVL=[];drawFrame(s.t1-0.001);EVL.forEach(e=>{if(e.t>=0&&e.t<=s.t1+.01&&e.t>=s.t0-0.01)EV.push(e)})});REC=false;
  WIPES.forEach(w=>EV.push({t:w-.2,k:'whoosh'}));EV.sort((a,b)=>a.t-b.t);
  window.READY=true});
</script>
