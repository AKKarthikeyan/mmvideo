<!doctype html>
<!-- Title cards for the selection reel: one 1.6 s card per sample, cut apart with ffmpeg afterwards. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Reel cards</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      #root { background: #0e1116; }
      #card { position: absolute; left: 160px; top: 270px; }
      #num { font: 700 260px/0.85 Oswald, sans-serif; color: #d9a441; }
      #name { font: 700 96px/1 Oswald, sans-serif; letter-spacing: 0.03em; color: #f7f3ea; margin-top: 26px; }
      #for { font: 400 40px/1.3 Inter, sans-serif; color: #c8cdd3; margin-top: 26px; }
      #data { font: 400 32px/1.3 Plex, monospace; color: #9fb0c2; margin-top: 12px; }
      #rule { position: absolute; left: 160px; top: 230px; height: 6px; width: 160px; background: #d9a441; transform-origin: 0 50%; }
    </style>
  </head>
  <body>
    <div id="root" class="night" data-composition-id="main" data-start="0" data-duration="24" data-width="1920" data-height="1080">
      <div id="rule"></div>
      <div id="card"><div id="num"></div><div id="name"></div><div id="for"></div><div id="data"></div></div>
      <div id="grain" data-layout-ignore></div>
    </div>
    <script>
      const H = HF.setup(24), E = HF.ease;
      window.__timelines.main = H.tl;
      const $ = (id) => document.getElementById(id);
      const C = [
        ["SATELLITE BEFORE / AFTER", "Moat Atlas · Indica Atlas", "Real data: Sentinel-2 imagery, 2018 vs 2026"],
        ["3D TERRAIN FLYOVER", "Indica Atlas", "Real data: AWS Terrain Tiles elevation"],
        ["DOCUMENT ON A DESK", "Moat & Margin · Moat Atlas", "Real page: Nomad letter, June 2004"],
        ["MONEY-FLOW BREAKDOWN", "Moat & Margin · Data Kadai", "Real figures: DMart, Jul–Sep 2026"],
        ["DOT CHART", "Data Kadai", "Real data: Census of India 1951 and 2011"],
        ["WIND AND FLOW MAP", "Indica Atlas", "Real data: NOAA GFS winds, 15 Jul 2025"],
        ["GLOBE WITH ARCS", "Moat Atlas", "Ranking: crude suppliers by volume, 2023"],
        ["EXPLODED 3D OBJECT", "The Inventor Desk", "Generic model built for illustration"],
        ["PATENT DRAWING THAT DRAWS ITSELF", "The Inventor Desk", "Style sample: drawing redrawn, not the original"],
        ["PHOTO WITH DEPTH", "Inventor Desk · Indica Atlas · Moat & Margin", "Style sample: shown on a channel illustration"],
        ["FLY-THROUGH TIMELINE", "Inventor Desk · Indica Atlas", "Dates: transistor to smartphone"],
        ["SCALE COMPARISON", "Data Kadai · Moat & Margin", "Our arithmetic: ₹1 lakh crore in ₹500 notes"],
        ["BIG-TYPE QUOTE", "Moat & Margin", "Real letter: Nomad, June 2004"],
        ["HAND-DRAWN NOTES", "All five channels", "Real letter: Nomad, June 2006"],
        ["3D DATA MAP", "Indica Atlas · Data Kadai", "Built earlier: Lok Sabha seats by state"],
      ];
      const CL = 1.6;
      H.render = (t) => {
        const i = Math.min(C.length - 1, Math.floor(t / CL)), u = t - i * CL;
        $("num").textContent = String(i + 1).padStart(2, "0");
        $("name").textContent = C[i][0];
        $("for").textContent = "Best for: " + C[i][1];
        $("data").textContent = C[i][2];
        const a = E.o3(u / 0.35);
        $("card").style.opacity = a * (1 - E.io2((u - 1.35) / 0.25));
        $("card").style.transform = `translateY(${(1 - a) * 30}px)`;
        $("rule").style.transform = `scaleX(${E.o3(u / 0.5)})`;
      };
      H.ready();
    </script>
  </body>
</html>
