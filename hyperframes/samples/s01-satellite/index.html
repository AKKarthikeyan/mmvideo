<!doctype html>
<!-- Sample 01 · Satellite before/after: Navi Mumbai airport site, Sentinel-2 L2A true colour, Jan 2018 vs Jan 2026. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Satellite before and after</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      #cam { position: absolute; left: -80px; top: -45px; width: 2080px; height: 1170px; transform-origin: 900px 700px; }
      #cam img { position: absolute; left: 0; top: 0; width: 2080px; height: 1170px; }
      #after { position: absolute; inset: 0; }
      #wipe { position: absolute; top: 0; width: 4px; height: 1170px; margin-left: -2px; background: #f7f3ea;
        box-shadow: 0 0 24px rgba(247, 243, 234, 0.8); }
      #scrimT { position: absolute; left: 0; top: 0; width: 1920px; height: 420px;
        background: linear-gradient(rgba(6, 8, 11, 0.78), rgba(6, 8, 11, 0)); }
      #scrimB { position: absolute; left: 0; bottom: 0; width: 1920px; height: 300px;
        background: linear-gradient(rgba(6, 8, 11, 0), rgba(6, 8, 11, 0.75)); }
      .chip { position: absolute; top: 470px; font: 700 44px/1 Oswald, sans-serif; letter-spacing: 0.06em;
        color: #0b0e13; background: #f7f3ea; padding: 10px 16px 12px; white-space: nowrap; }
      #chipB { transform: translateX(-100%); }
      #date { position: absolute; right: 110px; top: 92px; text-align: right; }
      #date .d { font: 700 92px/1 Oswald, sans-serif; color: #f7f3ea; letter-spacing: 0.02em; position: absolute; right: 0; top: 0; white-space: nowrap; }
      #date .l { position: absolute; right: 0; top: 104px; font: 28px/1 Plex, monospace; color: #c8cdd3; white-space: nowrap; }
      #runway line { stroke: #d9a441; stroke-width: 7; stroke-linecap: round; }
      #rlab { position: absolute; left: 640px; top: 845px; font: 700 40px/1 Oswald, sans-serif; letter-spacing: 0.06em;
        color: #0b0e13; background: #d9a441; padding: 8px 14px 10px; white-space: nowrap; transform-origin: 0 0; }
    </style>
  </head>
  <body>
    <div id="root" class="night" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="cam">
        <img id="before" src="assets/img/nmia_2018.jpg" alt="" />
        <div id="after">
          <img src="assets/img/nmia_2026.jpg" alt="" />
          <svg id="runway" width="2080" height="1170" viewBox="0 0 2080 1170">
            <line id="rw" x1="575" y1="801" x2="1170" y2="733" />
            <line id="rw0" x1="566" y1="783" x2="584" y2="819" />
            <line id="rw1" x1="1161" y1="715" x2="1179" y2="751" />
          </svg>
          <div id="rlab">RUNWAY ≈ 3.7 KM</div>
        </div>
        <div id="wipe"></div>
      </div>
      <div id="scrimT" data-layout-ignore></div>
      <div id="scrimB" data-layout-ignore></div>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div class="kicker">MOAT ATLAS · FROM ORBIT</div>
      <div class="head">NAVI MUMBAI AIRPORT SITE</div>
      <div id="date"><div class="d" id="d18">JAN 2018</div><div class="d" id="d26">JAN 2026</div><div class="l">SENTINEL-2 · 10 M PIXELS</div></div>
      <div class="chip" id="chipB">2026</div>
      <div class="chip" id="chipA">2018</div>
      <div class="src">Contains modified Copernicus Sentinel data 2018, 2026</div>
      <div class="cap" id="c1">January 2018: open land on the edge of Navi Mumbai.</div>
      <div class="cap" id="c2">January 2026: an international airport.</div>
    </div>
    <script>
      const H = HF.setup(10), E = HF.ease, F = HF.fade;
      window.__timelines.main = H.tl;
      const $ = (id) => document.getElementById(id);
      const RW = [575, 801, 1170, 733];
      const RLEN = Math.hypot(RW[2] - RW[0], RW[3] - RW[1]);
      $("rw").setAttribute("stroke-dasharray", RLEN);
      H.render = (t) => {
        const s = 1 + 0.22 * E.io2(t / 10);
        $("cam").style.transform = `scale(${s})`;
        // wipe position in image space: reveal 2026, hold, then slide back to a split
        const w = E.io3((t - 2.4) / 2.0) - 0.5 * E.io3((t - 7.0) / 1.3);
        const wx = w * 2080;
        $("after").style.clipPath = `inset(0 ${2080 - wx}px 0 0)`;
        $("wipe").style.left = `${wx}px`;
        const lineX = -80 + 900 + (wx - 900) * s;
        const onScreen = HF.clamp01((lineX - 140) / 120) * HF.clamp01((1780 - lineX) / 120);
        $("wipe").style.opacity = onScreen;
        $("chipB").style.left = `${lineX - 22}px`;
        $("chipA").style.left = `${lineX + 22}px`;
        $("chipA").style.opacity = $("chipB").style.opacity = onScreen;
        const toAfter = HF.clamp01((w - 0.48) / 0.04);
        $("d18").style.opacity = 1 - toAfter;
        $("d26").style.opacity = toAfter;
        $("date").style.opacity = F(t, 0.5, 99, 0.5) * (1 - F(t, 6.9, 99, 0.4));
        // runway: drawn on after the reveal, label pops in
        $("rw").setAttribute("stroke-dashoffset", RLEN * (1 - E.io2((t - 4.7) / 0.9)));
        $("rw0").style.opacity = $("rw1").style.opacity = F(t, 5.5, 99, 0.2);
        $("rlab").style.opacity = F(t, 5.6, 99, 0.3);
        $("rlab").style.transform = `scale(${E.back((t - 5.6) / 0.4)})`;
        document.querySelector(".kicker").style.opacity = F(t, 0.2, 99, 0.5);
        document.querySelector(".head").style.opacity = F(t, 0.35, 99, 0.6);
        $("c1").style.opacity = F(t, 0.6, 4.2, 0.3);
        $("c2").style.opacity = F(t, 4.5, 99, 0.3);
        $("root").style.filter = `brightness(${E.o2(t / 0.6)})`;
      };
      H.ready();
    </script>
  </body>
</html>
