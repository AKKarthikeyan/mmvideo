<!doctype html>
<!-- Sample 03 · Document on a desk: Nomad Investment Partnership interim letter (period ended 30 June 2004), the "no performance means no fees" line. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Document on a desk</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <script type="importmap">{ "imports": { "three": "./assets/lib/three.module.min.js" } }</script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      #root { background: #120c08; }
      #gl { position: absolute; inset: 0; }
      .kicker { color: #d9a441; background: rgba(18, 12, 8, 0.82); padding: 10px 14px; left: 96px; top: 80px; }
      #scrimB { position: absolute; left: 0; bottom: 0; width: 1920px; height: 240px; background: linear-gradient(rgba(18, 12, 8, 0), rgba(18, 12, 8, 0.8)); }
      #quote { position: absolute; right: 110px; bottom: 200px; width: 760px; padding: 34px 40px 30px; background: #f7f3ea; color: #1a1a1a;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.55); opacity: 0; transform-origin: 100% 100%; }
      #quote .q { font: italic 700 64px/1.08 Playfair, serif; }
      #quote .q em { font-style: italic; background: linear-gradient(transparent 58%, #f2c94c 58%); }
      #quote .by { font: 400 26px/1.3 Plex, monospace; color: #4a4237; margin-top: 18px; }
      .src { color: #d8cfbf; background: rgba(18, 12, 8, 0.85); padding: 8px 12px; right: 96px; bottom: 104px; }
    </style>
  </head>
  <body>
    <div id="root" class="night" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <canvas id="gl" class="clip" data-start="0" data-duration="10" data-track-index="1"></canvas>
      <div id="scrimB" data-layout-ignore></div>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div class="kicker">MOAT &amp; MARGIN · FROM THE SOURCE</div>
      <div id="quote"><div class="q">“<em>no performance means no fees</em>.”</div><div class="by">Nomad Investment Partnership · Interim Letter, period ended 30 June 2004</div></div>
      <div class="src">Source page: Nomad Investment Partnership letters (as published)</div>
      <div class="cap" id="c1">In 2004, Nomad's letter made a promise most fund managers won't:</div>
      <div class="cap" id="c2">no performance, no fees.</div>
    </div>
    <script>window.__S = HF.setup(10); window.__timelines.main = window.__S.tl;</script>
    <script type="module">
      import * as THREE from "three";
      const H = window.__S, E = HF.ease, F = HF.fade;
      const $ = (id) => document.getElementById(id);
      const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      const scene = new THREE.Scene();
      scene.background = new THREE.Color(0x120c08);
      const camera = new THREE.PerspectiveCamera(32, 1920 / 1080, 0.1, 200);

      // Walnut desk, generated: wavy grain plus fine noise.
      const wc = document.createElement("canvas"); wc.width = wc.height = 1024;
      const wg = wc.getContext("2d"), img = wg.createImageData(1024, 1024);
      let sd = 11; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
      const ph = Array.from({ length: 6 }, () => rnd() * 6.28);
      for (let y = 0; y < 1024; y++) for (let x = 0; x < 1024; x++) {
        const w = y + 22 * Math.sin(x * 0.0045 + ph[0]) + 7 * Math.sin(x * 0.019 + ph[1]) + 3 * Math.sin(x * 0.07 + y * 0.01);
        let v = 0.5 + 0.5 * Math.sin(w * 0.11 + Math.sin(w * 0.013 + ph[2]) * 3);
        v = 0.55 * v + 0.45 * (0.5 + 0.5 * Math.sin(w * 0.031 + ph[3])) + (rnd() - 0.5) * 0.08;
        const i = (y * 1024 + x) * 4;
        img.data[i] = 46 + v * 46; img.data[i + 1] = 28 + v * 28; img.data[i + 2] = 17 + v * 15; img.data[i + 3] = 255;
      }
      wg.putImageData(img, 0, 0);
      const wood = new THREE.CanvasTexture(wc);
      wood.colorSpace = THREE.SRGBColorSpace; wood.wrapS = wood.wrapT = THREE.RepeatWrapping; wood.repeat.set(3, 3); wood.anisotropy = 8;
      const desk = new THREE.Mesh(new THREE.PlaneGeometry(80, 80), new THREE.MeshStandardMaterial({ map: wood, roughness: 0.55, metalness: 0.05 }));
      desk.rotation.x = -Math.PI / 2; desk.receiveShadow = true;
      scene.add(desk);

      // Paper: a blank sheet underneath, the letter page on top with a gentle lift at one corner.
      const PW = 8.5, PH = 8.5 * 2105 / 1488;
      const sheet = (map, color) => {
        const g = new THREE.PlaneGeometry(PW, PH, 40, 56);
        const p = g.attributes.position;
        for (let i = 0; i < p.count; i++) {
          const u = (p.getX(i) + PW / 2) / PW, v = (p.getY(i) + PH / 2) / PH;
          p.setZ(i, 0.35 * Math.pow(Math.max(0, u - 0.7) / 0.3, 2) * Math.pow(Math.max(0, 0.25 - v) / 0.25, 1.5) + 0.02 * Math.sin(u * 3.1));
        }
        g.computeVertexNormals();
        const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ map, color, roughness: 0.92, side: THREE.DoubleSide }));
        m.rotation.x = -Math.PI / 2; m.castShadow = m.receiveShadow = true;
        return m;
      };
      const tex = new THREE.TextureLoader().load("assets/img/page.png", () => texReady());
      tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
      const under = sheet(null, 0xeee8dc);
      under.position.set(0.9, 0.01, 0.5); under.rotation.z = 0.09;
      const page = sheet(tex, 0xffffff);
      page.position.set(0, 0.03, 0); page.rotation.z = -0.05;
      scene.add(under, page);

      // Highlighter stroke over the quote (pixel box 826-1205 x 562-600 on the 1488x2105 page).
      const qx0 = 826 / 1488, qx1 = 1205 / 1488, qy = 581 / 2105, qh = 46 / 2105;
      const hlGeo = new THREE.PlaneGeometry(1, 1); hlGeo.translate(0.5, 0, 0);
      const hl = new THREE.Mesh(hlGeo, new THREE.MeshBasicMaterial({ color: 0xf2c94c, transparent: true, opacity: 0.55, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -4 }));
      hl.position.set((qx0 - 0.5) * PW, (0.5 - qy) * PH, 0.045);
      page.add(hl);
      const qLocal = new THREE.Vector3(((qx0 + qx1) / 2 - 0.5) * PW, (0.5 - qy) * PH, 0);

      // Pen: black barrel, gold band and clip.
      const pen = new THREE.Group();
      const gold = new THREE.MeshStandardMaterial({ color: 0xc9a14a, metalness: 1, roughness: 0.28 });
      const black = new THREE.MeshStandardMaterial({ color: 0x0d0d0f, metalness: 0.3, roughness: 0.25 });
      const barrel = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.17, 5.2, 40), black);
      const cap = new THREE.Mesh(new THREE.CylinderGeometry(0.185, 0.185, 2.2, 40), black); cap.position.y = 1.9;
      const band = new THREE.Mesh(new THREE.CylinderGeometry(0.19, 0.19, 0.16, 40), gold); band.position.y = 0.82;
      const nib = new THREE.Mesh(new THREE.ConeGeometry(0.17, 0.7, 40), gold); nib.position.y = -2.95; nib.rotation.x = Math.PI;
      const clip = new THREE.Mesh(new THREE.BoxGeometry(0.07, 1.6, 0.06), gold); clip.position.set(0, 2.1, 0.22);
      pen.add(barrel, cap, band, nib, clip);
      pen.traverse((o) => { o.castShadow = true; });
      pen.rotation.set(Math.PI / 2, 0, 0.62); pen.position.set(5.6, 0.2, 2.6);
      scene.add(pen);

      scene.add(new THREE.HemisphereLight(0xfff1e0, 0x1a120c, 0.35));
      const lamp = new THREE.SpotLight(0xffe0b0, 650, 60, 0.55, 0.75, 1.6);
      lamp.position.set(-7, 16, -6); lamp.target.position.set(1, 0, -1.5);
      lamp.castShadow = true; lamp.shadow.mapSize.set(2048, 2048); lamp.shadow.bias = -0.0004; lamp.shadow.radius = 6;
      scene.add(lamp, lamp.target);
      const fill = new THREE.DirectionalLight(0xbfd2ff, 0.25); fill.position.set(8, 6, 10); scene.add(fill);

      const path = (pts) => new THREE.CatmullRomCurve3(pts.map(([x, y, z]) => new THREE.Vector3(x, y, z)));
      const q = new THREE.Vector3();
      let camP, tgtP;
      const build = () => {
        page.updateMatrixWorld();
        q.copy(qLocal).applyMatrix4(page.matrixWorld);
        camP = path([[-1.5, 17, 11.5], [-0.6, 11, 7.5], [q.x - 1.6, 4.6, q.z + 4.6], [q.x - 1.2, 3.4, q.z + 3.4]]);
        tgtP = path([[0.4, 0, 0.3], [0.8, 0, -1], [q.x, 0, q.z], [q.x + 0.2, 0, q.z]]);
      };
      build();
      const look = new THREE.Vector3();
      H.render = (t) => {
        const u = E.io3(t / 7.2) * 0.94 + 0.06 * E.io2((t - 7.2) / 2.8);
        camera.position.copy(camP.getPoint(u));
        camera.lookAt(look.copy(tgtP.getPoint(u)));
        const s = E.io2((t - 5.4) / 0.9);
        hl.scale.set(Math.max(0.0001, (qx1 - qx0) * PW * s), qh * PH * 1.15, 1);
        hl.visible = s > 0;
        $("quote").style.opacity = F(t, 6.9, 99, 0.4);
        $("quote").style.transform = `scale(${E.back((t - 6.9) / 0.5, 1.2)})`;
        document.querySelector(".kicker").style.opacity = F(t, 0.3, 99, 0.6);
        $("c1").style.opacity = F(t, 0.9, 5.3, 0.3);
        $("c2").style.opacity = F(t, 5.6, 99, 0.3);
        renderer.render(scene, camera);
      };
      const texReady = () => H.ready();
    </script>
  </body>
</html>
