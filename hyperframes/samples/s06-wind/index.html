<!doctype html>
<!-- Sample 06 · Flow map: monsoon winds at 850 hPa, NOAA GFS analysis 15 Jul 2025 00 UTC, as particle trails. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Monsoon flow map</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <script src="assets/data/wind.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      #stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 1065px 428px; }
      #stage canvas { position: absolute; inset: 0; }
      .sea { position: absolute; font: italic 700 36px/1 Playfair, serif; color: rgba(247, 243, 234, 0.62); letter-spacing: 0.08em; white-space: nowrap; transform: translate(-50%, -50%); text-shadow: 0 0 12px #0b0e13, 0 0 4px #0b0e13; }
      .pin { position: absolute; opacity: 0; }
      .pin .ring { position: absolute; left: -22px; top: -22px; width: 44px; height: 44px; border-radius: 50%; border: 3px solid #f4d27a; }
      .pin .tx { position: absolute; left: 34px; top: -30px; white-space: nowrap; font: 700 38px/1 Oswald, sans-serif; letter-spacing: 0.06em;
        color: #0b0e13; background: #f4d27a; padding: 8px 14px 10px; }
      #legend { position: absolute; left: 110px; top: 250px; font: 400 28px/1.5 Inter, sans-serif; color: #c8cdd3; }
      #legend i { display: inline-block; width: 46px; height: 5px; border-radius: 3px; vertical-align: middle; margin-right: 12px; }
    </style>
  </head>
  <body>
    <div id="root" class="night" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div id="stage">
        <canvas id="base" width="1920" height="1080"></canvas>
        <canvas id="flow" width="1920" height="1080"></canvas>
        <div class="sea" id="sAS">ARABIAN SEA</div>
        <div class="sea" id="sBB">BAY OF BENGAL</div>
        <div class="pin" id="jet"><div class="ring"></div><div class="tx" id="jtx"></div></div>
      </div>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div class="kicker">INDICA ATLAS · MONSOON</div>
      <div class="head">HOW THE MONSOON BLOWS IN</div>
      <div id="legend"><div><i style="background:#5d7a96"></i>under 8 m/s</div><div><i style="background:#b7d3ea"></i>8 to 16 m/s</div><div><i style="background:#f4d27a"></i>over 16 m/s</div></div>
      <div class="src">Winds: NOAA GFS analysis · 850 hPa · 15 Jul 2025, 00 UTC</div>
      <div class="cap" id="c1">In July, winds rise from the southern Indian Ocean,</div>
      <div class="cap" id="c2">turn at the Horn of Africa and race across the Arabian Sea to India.</div>
    </div>
    <script>
      const H = HF.setup(10), E = HF.ease, F = HF.fade, W = window.WIND;
      window.__timelines.main = H.tl;
      const $ = (id) => document.getElementById(id);
      const KY = 28, KX = 28 * Math.cos((20 * Math.PI) / 180), LONC = 74, LATC = 17;
      const px = (lon, lat) => [960 + (lon - LONC) * KX, 540 + (LATC - lat) * KY];
      const ll = (x, y) => [LONC + (x - 960) / KX, LATC - (y - 540) / KY];

      // Base map: land, then India's outline.
      const b = $("base").getContext("2d");
      b.fillStyle = "#151b23"; b.strokeStyle = "#2b3542"; b.lineWidth = 1.5;
      for (const r of W.land) {
        b.beginPath();
        r.forEach(([lon, lat], i) => { const [x, y] = px(lon, lat); i ? b.lineTo(x, y) : b.moveTo(x, y); });
        b.closePath(); b.fill(); b.stroke();
      }
      const india = new Path2D();
      for (let i = 0; i < W.india.length; i += 4) {
        const [x0, y0] = px(W.india[i], W.india[i + 1]), [x1, y1] = px(W.india[i + 2], W.india[i + 3]);
        india.moveTo(x0, y0); india.lineTo(x1, y1);
      }
      const baseCanvas = document.createElement("canvas"); baseCanvas.width = 1920; baseCanvas.height = 1080;
      baseCanvas.getContext("2d").drawImage($("base"), 0, 0);

      // Wind sampling (bilinear on the 0.5° grid) and a seeded particle system replayed from t=0 every frame.
      const wind = (lon, lat) => {
        const fx = (lon - W.lon0) / W.step, fy = (W.lat1 - lat) / W.step;
        const x = Math.floor(fx), y = Math.floor(fy);
        if (x < 0 || y < 0 || x >= W.nx - 1 || y >= W.ny - 1) return null;
        const i = y * W.nx + x, u = fx - x, v = fy - y;
        if (W.high[i] && W.high[i + 1] && W.high[i + W.nx]) return null;
        const bl = (a) => a[i] * (1 - u) * (1 - v) + a[i + 1] * u * (1 - v) + a[i + W.nx] * (1 - u) * v + a[i + W.nx + 1] * u * v;
        return [bl(W.u), bl(W.v)];
      };
      const NP = 3600, TR = 14, SPD = 0.2;
      const rng = (s) => () => ((s = (s * 16807) % 2147483647) / 2147483647);
      const f = $("flow").getContext("2d");
      const COLS = ["#5d7a96", "#b7d3ea", "#f4d27a"];
      H.render = (t) => {
        const frames = Math.round(t * 30);
        const paths = COLS.map(() => new Path2D());
        for (let p = 0; p < NP; p++) {
          const r = rng(p * 7919 + 13);
          let x, y, age, life, trail = [];
          const spawn = () => { x = r() * 1920; y = r() * 1080; age = Math.floor(r() * 60); life = 50 + Math.floor(r() * 90); trail = []; };
          spawn();
          let s = 0;
          for (let k = 0; k <= frames; k++) {
            const [lon, lat] = ll(x, y);
            const w = wind(lon, lat);
            if (!w || age > life) { spawn(); continue; }
            s = Math.hypot(w[0], w[1]);
            trail.push([x, y]);
            if (trail.length > TR) trail.shift();
            x += w[0] * SPD; y -= w[1] * SPD;
            age++;
          }
          if (trail.length < 2) continue;
          const path = paths[s < 8 ? 0 : s < 16 ? 1 : 2];
          path.moveTo(trail[0][0], trail[0][1]);
          for (let k = 1; k < trail.length; k++) path.lineTo(trail[k][0], trail[k][1]);
        }
        f.clearRect(0, 0, 1920, 1080);
        f.drawImage(baseCanvas, 0, 0);
        f.lineCap = "round";
        f.globalAlpha = E.o2((t - 0.3) / 1.2);
        f.lineWidth = 2.2;
        paths.forEach((p, i) => { f.strokeStyle = COLS[i]; f.globalAlpha = E.o2((t - 0.3) / 1.2) * [0.55, 0.8, 0.95][i]; f.stroke(p); });
        f.globalAlpha = E.o2(t / 1.0);
        f.strokeStyle = "rgba(247, 243, 234, 0.75)"; f.lineWidth = 2;
        f.stroke(india);
        f.globalAlpha = 1;
        $("stage").style.transform = `scale(${1 + 0.07 * E.io2(t / 10)})`;
        for (const [id, lon, lat, a] of [["sAS", 64, 14.5, 1.4], ["sBB", 89, 15, 1.6]]) {
          const [x, y] = px(lon, lat); const el = $(id);
          el.style.left = `${x}px`; el.style.top = `${y}px`; el.style.opacity = F(t, a, 99, 0.6);
        }
        const [jx, jy] = px(W.jet[1], W.jet[0]);
        $("jet").style.left = `${jx}px`; $("jet").style.top = `${jy}px`;
        $("jet").style.opacity = F(t, 4.6, 99, 0.3);
        $("jet").querySelector(".ring").style.transform = `scale(${1 + 0.25 * Math.sin(t * 5)})`;
        document.querySelector(".kicker").style.opacity = F(t, 0.2, 99, 0.5);
        document.querySelector(".head").style.opacity = F(t, 0.35, 99, 0.6);
        $("legend").style.opacity = F(t, 1.2, 99, 0.5);
        $("c1").style.opacity = F(t, 0.9, 4.5, 0.3);
        $("c2").style.opacity = F(t, 4.8, 99, 0.3);
      };
      $("jtx").textContent = `SOMALI JET · ${Math.round(W.jet[2])} M/S`;
      H.ready();
    </script>
  </body>
</html>
