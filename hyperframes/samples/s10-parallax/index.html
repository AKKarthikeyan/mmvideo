<!doctype html>
<!-- Sample 10 · Still image with depth (2.5D parallax). Shown on an existing channel illustration (AI-generated, from the Moat Files textile video). -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Photo with depth</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <script type="importmap">{ "imports": { "three": "./assets/lib/three.module.min.js" } }</script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      #gl, #leaves { position: absolute; inset: 0; }
      .kicker { background: rgba(26, 26, 26, 0.86); color: #d9a441; padding: 10px 14px; left: 96px; top: 80px; }
      #card { position: absolute; left: 110px; bottom: 190px; color: #f7f3ea; }
      #card .y { font: 700 170px/0.9 Oswald, sans-serif; letter-spacing: 0.02em; text-shadow: 0 6px 30px rgba(0, 0, 0, 0.5); }
      #card .t { font: 700 44px/1 Oswald, sans-serif; letter-spacing: 0.1em; background: #1a1a1a; padding: 10px 16px 12px; display: inline-block; margin-top: 10px; }
      #flag { position: absolute; right: 110px; top: 92px; font: 700 26px/1 Oswald, sans-serif; letter-spacing: 0.1em; color: #1a1a1a; background: #7fd1ff; padding: 8px 12px 10px; }
      #scrimB { position: absolute; left: 0; bottom: 0; width: 1920px; height: 440px; background: linear-gradient(rgba(10, 8, 6, 0), rgba(10, 8, 6, 0.62)); }
      .src { color: #e6dccb; }
      .paper #grain { opacity: 0.07; }
      .paper #vig { --vig: 0.18; }
    </style>
  </head>
  <body>
    <div id="root" class="paper" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <canvas id="gl" class="clip" data-start="0" data-duration="10" data-track-index="1"></canvas>
      <canvas id="leaves" width="1920" height="1080"></canvas>
      <div id="scrimB" data-layout-ignore></div>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div class="kicker">MOAT &amp; MARGIN · MOAT FILES</div>
      <div id="flag">STYLE SAMPLE · SHOWN ON A CHANNEL ILLUSTRATION (AI-GENERATED)</div>
      <div id="card"><div class="y">1985</div><div class="t">THE LAST MILL CLOSES</div></div>
      <div class="src">Real version: a public-domain archive photograph, same depth treatment</div>
      <div class="cap" id="c1">In 1985, Berkshire Hathaway closed its textile business for good.</div>
    </div>
    <script>window.__S = HF.setup(10); window.__timelines.main = window.__S.tl;</script>
    <script type="module">
      import * as THREE from "three";
      const H = window.__S, E = HF.ease, F = HF.fade, L = HF.lerp;
      const $ = (id) => document.getElementById(id);
      const renderer = new THREE.WebGLRenderer({ canvas: $("gl"), antialias: false, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(1920, 1080, false);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      const scene = new THREE.Scene(), cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
      const loader = new THREE.TextureLoader();
      let pending = 2;
      const done = () => { if (--pending === 0) H.ready(); };
      const img = loader.load("assets/img/scene.jpg", done), dep = loader.load("assets/img/depth.png", done);
      img.colorSpace = THREE.SRGBColorSpace;
      img.minFilter = dep.minFilter = THREE.LinearFilter;
      // Depth-based parallax: each pixel is pushed away from the vanishing point by how near it is,
      // so a dolly-in grows the foreground faster than the street behind it.
      const mat = new THREE.ShaderMaterial({
        uniforms: { img: { value: img }, dep: { value: dep }, k: { value: 0 }, shift: { value: new THREE.Vector2() }, zoom: { value: 1.06 } },
        vertexShader: "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }",
        fragmentShader: `
          uniform sampler2D img, dep; uniform float k, zoom; uniform vec2 shift; varying vec2 vUv;
          void main(){
            vec2 vp = vec2(0.5, 0.269);
            vec2 p = vp + (vUv - vp) / zoom;
            vec2 src = p;
            for (int i = 0; i < 3; i++) {
              float n = texture2D(dep, src).r;
              src = vp + (p - vp) / (1.0 + k * n) + shift * n;
            }
            vec3 c = texture2D(img, clamp(src, 0.001, 0.999)).rgb;
            gl_FragColor = vec4(c, 1.0);
            #include <colorspace_fragment>
          }`,
      });
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2, 2), mat));

      // Falling leaves in front of the picture, seeded so every frame is repeatable.
      const lc = $("leaves").getContext("2d");
      let sd = 5; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
      const leaves = Array.from({ length: 18 }, () => ({ x: rnd() * 2100 - 90, y0: -100 - rnd() * 900, v: 70 + rnd() * 70, s: 10 + rnd() * 16, w: rnd() * 6.28, r: rnd() * 6.28, sw: 30 + rnd() * 60 }));
      H.render = (t) => {
        const u = E.io2(t / 10);
        mat.uniforms.k.value = 0.34 * u;
        mat.uniforms.zoom.value = 1.06 + 0.05 * u;
        mat.uniforms.shift.value.set(L(0.012, -0.012, u), L(-0.004, 0.004, u));
        renderer.render(scene, cam);
        lc.clearRect(0, 0, 1920, 1080);
        for (const l of leaves) {
          const y = l.y0 + l.v * t * 1.6, x = l.x + Math.sin(t * 1.3 + l.w) * l.sw;
          if (y < -40 || y > 1120) continue;
          lc.save(); lc.translate(x, y); lc.rotate(l.r + t * 1.7); lc.scale(1, 0.55 + 0.45 * Math.sin(t * 3 + l.w));
          lc.fillStyle = "#d9a441"; lc.strokeStyle = "#1a1a1a"; lc.lineWidth = 2;
          lc.beginPath(); lc.ellipse(0, 0, l.s, l.s * 0.5, 0, 0, Math.PI * 2); lc.fill(); lc.stroke();
          lc.restore();
        }
        document.querySelector(".kicker").style.opacity = F(t, 0.2, 99, 0.5);
        $("flag").style.opacity = F(t, 0.4, 99, 0.5);
        $("card").style.opacity = F(t, 1.4, 99, 0.6);
        $("card").style.transform = `translateY(${20 * (1 - E.o3((t - 1.4) / 0.8))}px)`;
        $("c1").style.opacity = F(t, 1.0, 99, 0.3);
      };
    </script>
  </body>
</html>
