<!doctype html>
<!-- Sample 11 · Travel-through timeline (CSS 3D): transistor to smartphone. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Fly-through timeline</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      #root { background: radial-gradient(1200px 800px at 50% 48%, #172233 0%, #0b0f16 60%, #06080c 100%); }
      #view { position: absolute; inset: 0; perspective: 1000px; perspective-origin: 50% 46%; overflow: hidden; }
      #world { position: absolute; left: 960px; top: 540px; transform-style: preserve-3d; }
      #world > * { position: absolute; transform-style: preserve-3d; }
      .card { width: 760px; margin-left: -380px; margin-top: -200px; padding: 34px 42px 36px; background: rgba(16, 24, 36, 0.86);
        border: 2px solid rgba(127, 209, 255, 0.38); box-shadow: 0 0 60px rgba(127, 209, 255, 0.12); }
      .card .y { font: 700 150px/0.9 Oswald, sans-serif; color: #d9a441; }
      .card .h { font: 700 54px/1.05 Oswald, sans-serif; letter-spacing: 0.04em; color: #f7f3ea; margin-top: 14px; }
      .card .l { font: 400 34px/1.3 Inter, sans-serif; color: #b9c4d2; margin-top: 10px; }
      .ghost { font: 700 520px/1 Oswald, sans-serif; color: #17263a; white-space: nowrap; margin-left: -620px; margin-top: -300px; }
      .rail { width: 8px; height: 260px; margin-left: -4px; margin-top: -130px; background: rgba(127, 209, 255, 0.85);
        box-shadow: 0 0 18px rgba(127, 209, 255, 0.8); }
      .tick { width: 260px; height: 6px; margin-left: -130px; background: #d9a441; box-shadow: 0 0 16px rgba(217, 164, 65, 0.9); }
      .mote { width: 6px; height: 6px; border-radius: 50%; background: rgba(200, 225, 255, 0.55); }
    </style>
  </head>
  <body>
    <div id="root" class="night" data-composition-id="main" data-start="0" data-duration="11" data-width="1920" data-height="1080">
      <div id="view"><div id="world"></div></div>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div class="kicker">THE INVENTOR DESK · TIMELINE</div>
      <div class="head">FROM TRANSISTOR TO SMARTPHONE</div>
      <div class="cap" id="cap"></div>
    </div>
    <script>
      const H = HF.setup(11), E = HF.ease, F = HF.fade, L = HF.lerp;
      window.__timelines.main = H.tl;
      const $ = (id) => document.getElementById(id);
      const EV = [
        ["1947", "THE TRANSISTOR", "Bell Labs shows a switch with no moving parts.", "1947: Bell Labs demonstrates the transistor."],
        ["1958", "THE INTEGRATED CIRCUIT", "Jack Kilby puts several parts on one chip.", "1958: Jack Kilby builds the first integrated circuit."],
        ["1971", "THE MICROPROCESSOR", "Intel's 4004: a computer's brain on one chip.", "1971: Intel's 4004 puts a processor on a single chip."],
        ["1973", "THE FIRST MOBILE CALL", "Martin Cooper calls from a handheld phone.", "1973: Martin Cooper makes a call from a handheld phone."],
        ["2007", "THE SMARTPHONE ERA", "Apple announces the iPhone.", "2007: the iPhone is announced."],
      ];
      const GAP = 1900, Z0 = 1300, FLOOR = 330;
      const w = $("world");
      const put = (el, x, y, z, extra = "") => (el.style.transform = `translate3d(${x}px, ${y}px, ${z}px) ${extra}`);
      for (let z = 400; z > -11000; z -= 420) {
        const r = document.createElement("div"); r.className = "rail"; w.appendChild(r);
        put(r, 0, FLOOR, z, "rotateX(90deg)");
      }
      const cards = EV.map(([y, h, l], i) => {
        const side = i % 2 ? 1 : -1;
        const g = document.createElement("div"); g.className = "ghost"; g.textContent = y; g.setAttribute("data-layout-ignore", ""); w.appendChild(g); // set dressing, not copy
        put(g, side * -260, -40, -Z0 - i * GAP - 900);
        const tk = document.createElement("div"); tk.className = "tick"; w.appendChild(tk);
        put(tk, 0, FLOOR, -Z0 - i * GAP, "rotateX(90deg)");
        const c = document.createElement("div"); c.className = "card"; c.setAttribute("data-layout-allow-occlusion", ""); c.setAttribute("data-layout-allow-overlap", "");
        c.innerHTML = `<div class="y">${y}</div><div class="h">${h}</div><div class="l">${l}</div>`;
        w.appendChild(c);
        put(c, side * 470, -10, -Z0 - i * GAP, `rotateY(${-side * 14}deg)`);
        return { c, g, tk, z: -Z0 - i * GAP, side };
      });
      let sd = 9; const rnd = () => ((sd = (sd * 16807) % 2147483647) / 2147483647);
      for (let i = 0; i < 140; i++) {
        const m = document.createElement("div"); m.className = "mote"; w.appendChild(m);
        put(m, (rnd() - 0.5) * 3600, (rnd() - 0.6) * 1400, -rnd() * 11000);
      }
      // camera: stop in front of each card, glide between
      const STOP = cards.map((k, i) => -k.z - 380);
      const arrive = (i) => 1.3 + i * 2.0;
      const camAt = (t) => {
        let c = L(-900, STOP[0], E.io3(t / 1.3));
        for (let i = 1; i < STOP.length; i++) c = L(c, STOP[i], E.io3((t - (arrive(i) - 1.0)) / 1.0));
        return c;
      };
      const caps = EV.map((e) => e[3]);
      H.render = (t) => {
        const c = camAt(t);
        let active = 0;
        for (let i = 0; i < STOP.length; i++) if (t >= arrive(i) - 0.6) active = i;
        // pan toward the card being read, eased with the same glide
        let cx = 0;
        for (let i = 0; i < STOP.length; i++) cx = L(cx, -cards[i].side * 250, E.io3((t - (arrive(i) - 1.0)) / 1.0));
        w.style.transform = `translate3d(${cx}px, 0, ${c}px)`;
        for (const k of cards) {
          const rel = k.z + c;
          const vis = HF.clamp01((rel + 5200) / 1600) * HF.clamp01((-rel - 60) / 220);
          k.c.style.opacity = vis; k.g.style.opacity = vis;
        }
        $("cap").textContent = caps[active];
        $("cap").style.opacity = F(t, 0.9, 99, 0.3);
        document.querySelector(".kicker").style.opacity = F(t, 0.2, 99, 0.5);
        document.querySelector(".head").style.opacity = F(t, 0.35, 99, 0.6);
      };
      H.ready();
    </script>
  </body>
</html>
