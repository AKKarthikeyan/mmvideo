<!doctype html>
<!-- Sample 16 · Paperscape: layered paper / quilled-cord relief landscapes drawn entirely in code, every element animated.
     Style sample (illustrative, no data). Engine: paperscape.js (height field per layer, per-pixel light, baked shadows);
     scenes: scenes.js. Vertical 1080 x 1920, three scenes of 8 s. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Paperscape</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <script src="paperscape.js"></script>
    <script src="scenes.js"></script>
    <link rel="stylesheet" href="assets/css/shorts.css" />
    <style>
      #cv { position: absolute; left: 0; top: 0; }
      #tag { position: absolute; left: 64px; top: 120px; font: 700 28px/1 Oswald, sans-serif; letter-spacing: 0.2em; color: rgba(247, 243, 234, 0.86);
        background: rgba(7, 9, 13, 0.55); padding: 9px 14px 11px; white-space: nowrap; }
      #grain { opacity: 0.1; mix-blend-mode: soft-light; }
      #vig { --vig: 0.42; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="24" data-width="1080" data-height="1920">
      <canvas id="cv" class="clip" data-layout-allow-overflow width="1080" height="1920" data-start="0" data-duration="24" data-track-index="1"></canvas>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div id="tag">ILLUSTRATION · DRAWN IN CODE</div>
    </div>
    <script>window.__S = HF.setup(24); window.__timelines.main = window.__S.tl;</script>
    <script>
      (function () {
        const H = window.__S, D = SCENES.D, cv = document.getElementById("cv"), ctx = cv.getContext("2d");
        const buf = [PS.canvas(1080, 1920), PS.canvas(1080, 1920)];
        let scenes = [];
        const XF = 0.7; // crossfade between scenes
        function paint(k, t, c) { const g = c.getContext("2d"); g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.fillStyle = "#07090d"; g.fillRect(0, 0, 1080, 1920); scenes[k](g, t); g.setTransform(1, 0, 0, 1, 0, 0); }
        H.render = (t) => {
          if (!scenes.length) return;
          const n = scenes.length, k = Math.min(n - 1, Math.floor(t / D)), lt = t - k * D;
          paint(k, lt, buf[0]);
          ctx.globalAlpha = 1; ctx.drawImage(buf[0], 0, 0);
          if (k < n - 1 && lt > D - XF) { paint(k + 1, 0, buf[1]); ctx.globalAlpha = (lt - (D - XF)) / XF; ctx.drawImage(buf[1], 0, 0); ctx.globalAlpha = 1; }
          document.getElementById("tag").style.opacity = HF.fade(t, 0.4, 99, 0.5);
        };
        const go = () => { scenes = SCENES.list.map((f) => f()); window.__built = true; H.ready(); };
        document.fonts ? document.fonts.ready.then(go) : go();
      })();
    </script>
  </body>
</html>
