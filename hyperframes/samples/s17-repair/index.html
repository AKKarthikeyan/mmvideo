      const BMAX = 380;   // the bar runs 0-380 words; the band marks the 300-350 budget
      $("band").style.left = (300 / BMAX) * 100 + "%"; $("band").style.width = (50 / BMAX) * 100 + "%";
      const col = { none: "#2b3654", part: "var(--amber)", miss: "var(--red)", ok: "var(--ok)" };
      const status = (i, t) => {
        if (i === 2) return t >= 32.3 ? "ok" : t >= 12.4 ? "miss" : "none";
        return t >= 15.6 ? "part" : "none";
      };

      H.render = (rt) => {
        const t = script(rt);
        // act 1: the question, its three demands
        const a1 = F(t, 0, 5.8, 0.5);
        $("act1").style.opacity = a1;
        $("act1").style.visibility = t < 6.3 ? "visible" : "hidden";
        $("qcard").style.transform = `translateY(${(1 - E.o3((t - 0.4) / 0.6)) * 30}px)`;
        hls.forEach((h, i) => (h.style.backgroundSize = `${E.io2((t - 1.4 - i * 1.2) / 0.8) * 100}% 40%`));
        chips.forEach((c, i) => {
          c.style.opacity = F(t, 1.9 + i * 1.2, 99, 0.35);
          c.style.transform = `translateY(${(1 - E.o3((t - 1.9 - i * 1.2) / 0.45)) * 16}px)`;
        });

        // act 2: the page slides in and the illustrative answer writes itself
        const pIn = E.io3((t - 5.9) / 0.7), pOut = E.io3((t - 38.4) / 0.6);
        $("page").style.transform = `translateX(${(1 - pIn) * -1320}px)`;
        $("panel").style.opacity = F(t, 6.3, 99, 0.5);
        $("stamp").style.opacity = F(t, 6.6, 99, 0.3);
        const y = yAt(t);
        let wn = 0;
        for (const l of lines) {
          const h = height(l, t), w = written(l, t);
          l.d.style.top = y[l.id] + "px";
          l.d.style.opacity = l.kind === "o" ? Math.min(1, h * 1.4) * (t >= l.tw ? 1 : 0) : h >= 0.99 ? 1 : 0;
          l.d.style.clipPath = `inset(-10px calc(${(1 - w) * 100}% - 24px) -10px -12px)`;
          l.x.style.transform = `scaleX(${l.tx ? E.io2((t - l.tx) / 0.4) : 0})`;
          wn += l.n * w * h;
        }

        // act 3: diagnosis. The ring, the arrow, the writing gap; then the content gap in the margin
        draw(R, E.io2((t - 11.2) / 0.8)); R.p.style.opacity = 1 - C((t - 18.5) / 0.5);
        draw(AR, E.io2((t - 11.9) / 0.5)); AR.p.style.opacity = 1 - C((t - 18.5) / 0.5);
        $("dx").style.opacity = F(t, 12.2, 18.5, 0.4);
        draw(G1, E.io2((t - 15.0) / 0.4)); draw(G2, E.io2((t - 15.3) / 0.4));
        const gOut = 1 - C((t - 18.5) / 0.5);
        G1.p.style.opacity = gOut; G2.p.style.opacity = gOut;
        gq.forEach((q, i) => (q.style.opacity = F(t, 15.3 + i * 0.3, 18.5, 0.3)));
        $("gx").style.opacity = F(t, 15.6, 18.5, 0.4);
        rows.forEach((r, i) => {
          const s = status(i, t);
          r.bd.style.background = col[s]; r.bd.style.color = s === "none" ? "#f7f3ea" : "#0a0f1c";
          r.st.textContent = T.st[s]; r.st.style.color = s === "none" ? "#b9c0c8" : col[s];
        });

        // act 4: repair log, word count, time
        $("rp").style.opacity = F(t, 18.9, 99, 0.4);
        const rT = [19.0, 20.6, 28.8];
        reps.forEach((r, i) => (r.style.opacity = F(t, rT[i], 99, 0.35)));
        $("wc").style.opacity = F(t, 19.0, 99, 0.4);
        const shown = t < 19 ? W0 : Math.round(wn);
        $("wcn").textContent = shown;
        $("fill").style.width = Math.min(100, (shown / BMAX) * 100) + "%";

        // act 5: the honest status line
        $("rub").style.opacity = F(t, 32.8, 99, 0.5);
        $("src").textContent = t < 6.1 ? T.src1 : T.src2;
        $("src").style.opacity = F(t, 0.8, 38.3, 0.4);

        // act 6: the fresh question, slides up over everything
        $("tr").style.transform = `translateY(${(1 - pOut) * 1120}px)`;
        $("tr").style.visibility = t >= 38.3 ? "visible" : "hidden";
        $("page").style.visibility = $("panel").style.visibility = $("src").style.visibility = t >= 39.0 ? "hidden" : "visible";
        $("tk").style.opacity = F(t, 39.1, 99, 0.4);
        $("tq").style.opacity = F(t, 39.4, 99, 0.4);
        $("tsk1").style.opacity = $("tsv1").style.opacity = F(t, 40.9, 99, 0.4);
        $("tsk2").style.opacity = $("tsv2").style.opacity = F(t, 42.2, 99, 0.4);
        $("ck").style.opacity = F(t, 43.2, 99, 0.4);
        cks.forEach((c, i) => (c.style.opacity = F(t, 43.6 + i * 0.5, 99, 0.3)));
        $("tc").style.opacity = F(t, 45.6, 99, 0.4);
      };
      // measure once the handwriting font is in: a line wider than the page shrinks a little; the strike fits the text
      document.fonts.ready.then(() => {
        for (const l of lines) {
          if (l.d.scrollWidth > 1000) l.d.style.fontSize = Math.floor(40 * 1000 / l.d.scrollWidth) + "px";
          l.x.style.width = l.d.scrollWidth + 12 + "px";
        }
        H.ready();
      });
    </script>
  </body>
</html>
