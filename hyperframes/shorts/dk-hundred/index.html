    <script>
      const { H, Q, caps, S, hi } = SH.init(), Z = HF.ease, F = HF.fade, C = HF.clamp01, L = HF.lerp;
      window.__timelines.main = H.tl;
      const $ = (id) => document.getElementById(id), D = S.dur;
      const T = { kick: "DATA KADAI · KADAI KANAKKU", noteA: "I PAID ₹100<br />AT DMART.", noteB: "HOW MUCH DOES<br />DMART KEEP?",
        src: "DMart results, 10 Oct 2026 (Jul–Sep 2026) · the split per ₹100 of sales is our arithmetic · coins rounded",
        trays: ["THE GOODS", "STAFF", "RUNNING COSTS", "WEAR + INTEREST", "DMART KEEPS"], bigLab: "OF YOUR ₹100<br />BEFORE INCOME TAX", left: "COINS LEFT",
        cardK: "DMART · JULY–SEPTEMBER 2026", cardU: "CRORE OF SALES IN THREE MONTHS", cardS: "Source: Avenue Supermarts results, 10 Oct 2026",
        disc: "Illustration; figures from DMart's results. Educational, not investment advice. Not SEBI-registered.", nT: "THAMBI", nA: "ANNA" };
      ["kick", "noteA", "noteB", "src", "bigLab", "cardK", "cardU", "cardS", "disc", "nT", "nA"].forEach((k) => { $(k).innerHTML = T[k]; });
      // awning scallops
      let sc = ""; for (let i = 0; i < 9; i++) sc += `<path d="M${i * 120} 280 h120 v12 a60 60 0 0 1 -120 0 Z" fill="${i % 2 ? "#f3ead7" : "#f2a71b"}" />`;
      $("scallop").innerHTML = sc;
      // ---- the split: exact rupees for the labels, whole coins for the picture (86 + 2 + 5 + 2 + 5 = 100)
      const PART = [[85.85, 86], [2.06, 2], [4.77, 5], [1.80, 2], [5.62, 5]];
      PART.forEach((p, i) => { $(`t${i}n`).textContent = T.trays[i]; });
      const part = (k) => (k < 86 ? 0 : k < 88 ? 1 : k < 93 ? 2 : k < 95 ? 3 : 4), first = [0, 86, 88, 93, 95];
      const GX = 119, GY = 369, CELL = 50, R = 22;
      const grid = (k) => [GX + (k % 10) * CELL, GY + Math.floor(k / 10) * CELL];
      const trayPos = (k) => { const p = part(k), j = k - first[p], y0 = 340 + p * 102;
        return p === 0 ? [648 + (j % 29) * 12.4, y0 + 53 + Math.floor(j / 29) * 12] : [656 + j * 44, y0 + 62]; };
      // ---- times
      const tCount = Q("count"), tCoins = Q("coins"), tGoods = Q("goods"), tReact = Q("react"), tStaff = Q("staff"), tRun = Q("run"), tWear = Q("wear"), tLeft = Q("left"),
        tKeep = Q("keep"), tTax = Q("tax"), tHow = Q("how"), tBig = Q("big"), tSlice = Q("slice"), tMon = Q("months"), tEnd = Q("end"), tQ = Q("q");
      const tFly = [tGoods, tStaff, tRun, tWear, tKeep], tBack = tEnd;
      const who = (t) => { for (const b of S.beats) if (t >= b.t0 && t < b.t0 + b.sec) return b.who; return null; };
      const g = $("coins").getContext("2d"), g2 = $("coinsTop").getContext("2d");
      function coin(c, x, y, r, a = 1) {
        c.globalAlpha = a; c.beginPath(); c.arc(x, y + 4, r, 0, 7); c.fillStyle = "rgba(29,26,22,0.28)"; c.fill();
        c.beginPath(); c.arc(x, y, r, 0, 7); c.fillStyle = "#f2a71b"; c.fill();
        c.beginPath(); c.arc(x, y, r * 0.72, 0, 7); c.strokeStyle = "#c98410"; c.lineWidth = r * 0.12; c.stroke();
        c.fillStyle = "#8a5a06"; c.font = `700 ${Math.round(r * 0.9)}px Oswald, sans-serif`; c.textAlign = "center"; c.textBaseline = "middle"; c.fillText("1", x, y + 1); c.globalAlpha = 1;
      }
      const set = (id, tr) => $(id).setAttribute("transform", tr);
      H.render = (t) => {
        const q = Math.floor(t * 12) / 12;                       // cut-out motion on twos; type and counters stay smooth
        const sp = who(t), talk = (k) => (sp === k ? 5 + 13 * Math.abs(Math.sin(q * 20.1)) : 4);
        const back = Z.io2((q - tBack) / Math.max(0.4, D - 0.08 - tBack));          // the rewind for the loop
        // ---- the ₹100 note, then a hundred coins
        const burst = Z.io2((q - tCoins) / 0.5) - back;
        $("note").style.visibility = burst < 0.98 ? "visible" : "hidden";
        $("note").style.transform = `rotate(${-2 + 1.2 * Math.sin(q * 2.2)}deg) scale(${1 - 0.86 * burst})`;
        const cd = F(t, tBig, tEnd, 0.2);
        g.clearRect(0, 0, 1080, 1920); g2.clearRect(0, 0, 1080, 1920);
        for (let k = 0; k < 100; k++) {
          const p = part(k), gp = grid(k), tp = trayPos(k), spread = Z.o3((q - tCoins - 0.1 - k * 0.006) / 0.5) * (1 - back);
          if (spread <= 0) continue;
          const fly = Z.io2((q - tFly[p] - (k - first[p]) * (p === 0 ? 0.012 : 0.07)) / 0.6) * (1 - back);
          let x = L(540, gp[0], spread), y = L(594, gp[1], spread), r = R * (0.5 + 0.5 * spread);
          if (p === 4) {                                           // the five that stay: they gather, then go to the tin
            const gather = Z.io2((q - tLeft) / 0.5) * (1 - back), mx = 204 + (k - 95) * 70, my = 790;
            x = L(x, mx, gather); y = L(y, my, gather); r = L(r, 31, gather);
          }
          x = L(x, tp[0], fly); y = L(y, tp[1] - 60 * Math.sin(Math.PI * fly), fly); r = L(r, p === 0 ? 13 : 19, fly);
          coin(fly > 0.02 ? g2 : g, x, y, r, p < 4 ? 1 - cd : 1);
        }
        // the 62 paise that the rounded coins hide
        const sm = F(q, tKeep + 0.7, tBack, 0.2);
        if (sm > 0) { const tp = trayPos(99); coin(g2, tp[0] + 40, tp[1] + 4, 12, sm); }
        // ---- trays and their running totals
        PART.forEach(([v], i) => {
          const o = F(t, tCoins + 0.3, tBack + 0.2, 0.3), n = PART[i][1], u = C((t - tFly[i]) / (i === 0 ? 1.6 : 0.6 + n * 0.07));
          $("t" + i).style.opacity = o * (i < 4 ? 1 - cd : 1); $(`t${i}v`).textContent = t < tFly[i] ? "" : "₹" + (v * Z.o3(u)).toFixed(2);
          $("t" + i).style.transform = `scale(${1 + 0.05 * F(t, tFly[i], tFly[i] + 0.5, 0.15) + (i === 4 ? 0.07 * F(t, tSlice, tSlice + 1.2, 0.2) : 0)})`;
        });
        // ---- coins still on the board, then the reveal in the same place
        let flown = 0; for (let i = 0; i < 4; i++) flown += Math.round(PART[i][1] * C((t - tFly[i]) / (i === 0 ? 1.5 : 0.4 + PART[i][1] * 0.07)));
        const cnt = F(t, tGoods + 0.3, tKeep, 0.2), rv = F(t, tKeep + 0.15, tBig, 0.18);
        $("big").style.opacity = Math.max(cnt, rv); $("big").textContent = t < tKeep + 0.05 ? String(100 - flown) : "₹5.62";
        $("big").style.fontSize = t < tKeep + 0.05 ? "190px" : "176px";
        $("big").style.transform = `scale(${t < tKeep + 0.05 ? 1 + 0.06 * F(t, tLeft, tKeep, 0.15) : 0.7 + 0.3 * Z.back((t - tKeep - 0.15) / 0.4)})`;
        $("bigLab").innerHTML = t < tTax ? T.left : T.bigLab; $("bigLab").style.opacity = Math.max(F(t, tGoods + 0.3, tKeep, 0.2), F(t, tTax, tBig, 0.2));
        $("noteB").style.opacity = t > D - 1 ? 0 : C((t - tQ) / 0.12); $("noteB").style.transform = `scale(${0.8 + 0.2 * Z.back((t - tQ) / 0.3)})`;
        // ---- the evidence card
        const cu = Z.o3((q - tBig) / 0.35);
        $("card").style.opacity = cd; $("card").style.transform = `translateY(${60 * (1 - cu)}px) rotate(${-1.5 + 0.5 * Math.sin(q * 1.7)}deg)`;
        $("cardM").style.width = "620px"; $("cardM").style.transform = `scaleX(${Z.o3((t - tMon) / 0.45)})`; $("cardU").style.opacity = C((t - tMon) / 0.15);
        $("cardU").style.transform = `translateX(${-30 * (1 - Z.o3((t - tMon) / 0.35))}px)`;
        $("cardH").textContent = "₹" + Math.round(L(0, 19206, Z.o3((t - tBig - 0.1) / 0.9))).toLocaleString("en-IN");
        // ---- Thambi (asks) and Anna (explains)
        const blink = (ph) => (((q + ph) % 3.3) < 0.1 ? 1.5 : 1);
        const wide = F(q, tReact, tStaff, 0.1) + F(q, tHow, tBig, 0.1), jump = 18 * F(q, tReact, tReact + 0.5, 0.12) + 12 * F(q, tHow, tHow + 0.5, 0.12);
        set("thambi", `translate(232 ${1044 - jump})`);
        set("tHead", `rotate(${(sp === "T" ? 3 : 1.2) * Math.sin(q * 4.1) + 5 * (sp === "A" ? 1 : 0)})`);
        $("tMouth").setAttribute("ry", wide > 0.5 && sp !== "T" ? 15 : talk("T"));
        ["tE1", "tE2"].forEach((id) => { $(id).setAttribute("ry", wide > 0.5 ? 14 : 10 / blink(0.4) / (blink(0.4) > 1 ? 4 : 1)); $(id).setAttribute("rx", wide > 0.5 ? 13 : 10); });
        set("tBrow", `translate(0 ${-12 * wide})`);
        set("tBody", `rotate(${0.8 * Math.sin(q * 2.0)})`);
        const point = Math.max(F(q, tGoods - 0.2, tReact, 0.25), F(q, tStaff - 0.2, tLeft, 0.25), F(q, tKeep - 0.1, tHow, 0.25));
        set("anna", "translate(848 1036)");
        set("aHead", `rotate(${(sp === "A" ? 3 : 1) * Math.sin(q * 3.7 + 1) - 4 * (sp === "T" ? 1 : 0)})`);
        $("aMouth").setAttribute("ry", talk("A"));
        ["aE1", "aE2"].forEach((id) => $(id).setAttribute("ry", blink(1.7) > 1 ? 2 : 9));
        set("aBody", `rotate(${0.7 * Math.sin(q * 1.8 + 2)})`);
        set("aArm", `translate(-120 250) rotate(${L(-150, -28 + 6 * Math.sin(q * 5), point)})`);
        $("src").style.opacity = 1;
        caps(t);
      };
      document.fonts.ready.then(() => H.ready());
    </script>
