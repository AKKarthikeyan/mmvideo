    <script>
      const { H, Q, caps, S } = SH.init(), Z = HF.ease, F = HF.fade, C = HF.clamp01, L = HF.lerp, PP = PAPER;
      window.__timelines.main = H.tl;
      const $ = (id) => document.getElementById(id), D = S.dur;
      const T = { kick: "DATA KADAI · IN YOUR POCKET", src: "DGCIS trade data, April 2025–March 2026 · via Vonter/india-export-import (ODbL) · no borders drawn",
        labB: "OF EXPORTS IN ONE YEAR", scrC: "exported<br />Apr 2025–Mar 2026", tagT: "PHONES + TELECOM GEAR",
        chT: "PHONE + TELECOM GEAR EXPORTS", chS: "₹ lakh crore · years run April to March", c55b: "April 2021–March 2022",
        mT: "WHERE THE PHONES LEAVE INDIA · 2025–26", n91: "4 airports<br />carry 91%", n69b: "from two airports",
        tB: "BENGALURU AIRPORT<em>23%</em>", tC: "CHENNAI AIRPORT<em>46%</em>", wT: "WHO BUYS THEM · SHARE OF 2025–26 EXPORTS",
        w1: "UAE 12%", w2: "CHINA 8%", w3: "OTHERS 22%", wn1: "the south", wn2: "by air", wn3: "America" };
      ["kick", "src", "labB", "scrC", "tagT", "chT", "chS", "c55b", "mT", "n91", "n69b", "tB", "tC", "wT", "wn1", "wn2", "wn3"].forEach((k) => { $(k).innerHTML = T[k]; });
      ["w1", "w2", "w3"].forEach((k) => { $(k).querySelector("span").textContent = T[k]; });
      let tk = ""; for (let i = 0; i <= 44; i++) tk += `<rect x="${12 + i * 20}" y="0" width="2" height="${i % 5 ? 16 : 30}" />`;
      $("ticks").innerHTML = tk;
      // ---- paper: tear what was torn, leave scissor cuts straight
      PP.grain();
      PP.piece("label", { l: 16, r: 18 }, 3); PP.piece("chart", { t: 15, b: 10 }, 5); PP.piece("mapS", { t: 9, r: 9, b: 12, l: 9 }, 8); PP.piece("world", { t: 12, r: 8, b: 9, l: 8 }, 13);
      // ---- the chart: exports by year, ₹ lakh crore (DGCIS)
      const FY = [["21–22", 55126], ["22–23", 103849], ["23–24", 142953], ["24–25", 221528], ["25–26", 302805]], COL = ["#2b59c3", "#c8a56a", "#c8a56a", "#c8a56a", "#e8452c"];
      $("bars").innerHTML = FY.map(([y, v], i) => { const x = 70 + i * 167.5, h = v / 1e5 * 190;
        return `<div class="bar" id="b${i}" style="left: ${x}px; height: ${h}px; background: ${COL[i]}"></div><div class="bv" id="v${i}" style="left: ${x - 20}px; top: ${790 - h + 16}px; color: ${i > 0 && i < 4 ? "#1b1a17" : "#f2ead8"}">${(v / 1e5).toFixed(2)}</div><div class="by" style="left: ${x - 20}px">${y}</div>`; }).join("");
      // ---- the India map (shaded relief; no borders) inside its sheet: sheet-local = frame - (50, 485)
      const M = ATLAS.create("map", [["assets/atlas/in6.jpg", [0.625, 0.28125, 0.8125, 0.546875]]]);
      const BLR = [77.71, 13.2], MAA = [80.17, 12.99], WIDE = [77, 21.5, 3900], SOUTH = [78.9, 14.5, 1250];
      const loc = (ll) => { const p = M.P(ll); return [p[0] - 50, p[1] - 485]; };
      M.cam(...SOUTH); { const a = loc(BLR), b = loc(MAA), cx = (a[0] + b[0]) / 2, cy = (a[1] + b[1]) / 2 - 30, rx = (b[0] - a[0]) / 2 + 92, ry = 104;
        $("mLoop").setAttribute("d", `M${cx - rx * 0.9} ${cy - ry * 0.5} C${cx - rx} ${cy - ry * 1.5} ${cx + rx * 1.1} ${cy - ry * 1.4} ${cx + rx} ${cy} C${cx + rx * 0.9} ${cy + ry * 1.5} ${cx - rx * 1.2} ${cy + ry * 1.3} ${cx - rx} ${cy - ry * 0.1} C${cx - rx * 0.95} ${cy - ry * 0.9} ${cx - rx * 0.5} ${cy - ry * 1.2} ${cx - rx * 0.2} ${cy - ry * 1.25}`); }
      M.cam(...WIDE); const SHIP = loc([67.3, 14.2]);
      $("mX1").setAttribute("d", `M${SHIP[0] - 86} ${SHIP[1] - 62} L${SHIP[0] + 90} ${SHIP[1] + 66}`); $("mX2").setAttribute("d", `M${SHIP[0] + 88} ${SHIP[1] - 60} L${SHIP[0] - 84} ${SHIP[1] + 62}`);
      // ---- the world, printed as dots (Natural Earth land; no borders). x = (lon + 140) * 3.5, y = (78 - lat) * 3.5
      const WX = (lon) => (lon + 140) * 3.5, WY = (lat) => (78 - lat) * 3.5;
      (function () {
        const m = document.createElement("canvas"); m.width = 980; m.height = 440; const c = m.getContext("2d"); c.fillStyle = "#000";
        LAND.forEach((ring) => { c.beginPath(); ring.forEach(([lo, la], i) => (i ? c.lineTo(WX(lo), WY(la)) : c.moveTo(WX(lo), WY(la)))); c.closePath(); c.fill(); });
        const px = c.getImageData(0, 0, 980, 440).data, g = $("wmap").getContext("2d"); g.fillStyle = "rgba(43, 89, 195, 0.9)";
        for (let j = 0, y = 6; y < 440; y += 9, j++) for (let x = 6 + (j % 2) * 4.5; x < 980; x += 9) if (px[(Math.round(y) * 980 + Math.round(x)) * 4 + 3] > 128) { g.beginPath(); g.arc(x, y, 3.3, 0, 7); g.fill(); }
      })();
      const IND = [WX(78.9), WY(13.1) + 70], USA = [WX(-98), WY(39) + 70];
      $("thread").setAttribute("d", `M${IND[0]} ${IND[1]} Q${(IND[0] + USA[0]) / 2} ${-70} ${USA[0]} ${USA[1]}`);
      const TH = $("thread"), THN = TH.getTotalLength();
      // ---- times
      const tPocket = Q("pocket"), tPhone = Q("phone"), tAgo = Q("ago"), tFifty = Q("fifty"), tTimes = Q("times"), tShip = Q("ship"), tCross = Q("cross"), tFly = Q("fly"), tTwo = Q("two"),
        tWho = Q("who"), tUsa = Q("usa"), tSouth = Q("south"), tAir = Q("air"), tAm = Q("america"), tEnd = Q("end"), dBack = Math.max(0.25, Math.min(0.5, D - tEnd - 0.2));
      // a piece of paper laid at (x, y): p = 0 off the desk in the direction `from`, 1 in place; it shakes a little each time it is re-laid
      function lay(id, x, y, rot, p, from, seed, t, extra = "") {
        const el = $(id); el.style.visibility = p > 0.002 ? "visible" : "hidden";
        el.style.transform = `translate(${x + from[0] * (1 - p)}px, ${y + from[1] * (1 - p)}px) rotate(${rot + 7 * (1 - p) + 0.3 * PP.wob(seed, t)}deg) ${extra}`;
      }
      const inn = (q, a, d = 0.42) => Z.o3((q - a) / d), out = (q, b, d = 0.36) => 1 - Z.io2((q - b) / d);
      const show = (id, o) => { $(id).style.opacity = o; };
      H.render = (t) => {
        const q = PP.twos(t); PP.boil(t);
        const back = Z.io2((q - tEnd) / dBack);                                      // everything returns for the loop
        // ---- scene 1: the label, the pocket, the phone
        lay("label", 110, 318, -3, Math.max(out(q, tPocket), back), [-900, -500], 1, t);
        lay("pocket", 220, 600, 0, Math.max(out(q, tPhone), back), [0, 1500], 2, t);
