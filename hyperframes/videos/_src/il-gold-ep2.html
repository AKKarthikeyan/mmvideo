        if (draw) draw(s);
        return put(Ly, d, { fx: "slideU", ...o });

      const applyFx = (it, t) => {
        const u = t - it.at; let o = 1, tr = "", clip = null;
        switch (it.fx) {
          case "pop": { const v = E.o3(u / 0.35); o = C(u / 0.2); tr = `scale(${L(1.08, 1, v)})`; break; }
          case "slam": { const v = C(u / 0.24); o = u >= 0 ? 1 : 0; tr = `scale(${L(1.7, 1, E.o3(v))})`; break; }
          case "drop": { const v = E.o3(u / 0.55); o = C(u / 0.15); tr = `translateY(${L(-90, 0, v)}px)`; break; }
          case "slideL": { const v = E.o3(u / 0.6); o = C(u / 0.2); tr = `translateX(${L(-600, 0, v)}px)`; break; }

          case "fade": o = C(u / 0.4); break;
          case "none": o = 1; break;
        }
        if (it.until != null) o *= 1 - C((t - it.until) / 0.25);
        it.node.style.opacity = o;
        it.node.style.transform = `${tr} rotate(${it.rot}deg)`;

      const certificate = (Ly, o) => {
        const h = `<div style="position:absolute;inset:16px;border:2px solid ${GREEN}"></div>

          <div style="position:absolute;left:0;right:0;top:112px;text-align:center;font:400 62px/1 Anton,Oswald,sans-serif;color:${INK}">SOVEREIGN GOLD BOND</div>

      const person = (g, x, y, s, fill) => { el("circle", { cx: x, cy: y - 34 * s, r: 11 * s, fill }, g); el("rect", { x: x - 13 * s, y: y - 20 * s, width: 26 * s, height: 38 * s, rx: 10 * s, fill }, g); };

        lg.row("AUG → NOW", `−${(100 * (AUG - NOW) / AUG).toFixed(0)}%`, Tf("s8_units", 0.72), { color: RED });
        lg.row("NOT", "A THIRD", Tf("s8_units", 0.85));
      }
      { const Ly = layer(T("s8_est"), T("s9_where")); bgL(Ly, "newsprint.jpg", 0.55);
        hd(Ly, `${N.cb_t} TONNES`, { x: 160, y: 150, size: 110, color: GOLDT, fx: "fade" });
        px(Ly, "central banks · Jul–Sep 2026", { x: 166, y: 290, fx: "fade" });
        const s = svgL(Ly), qs = [];
        for (let k = 0; k < 60; k++) { const c = k % 15, rr = Math.floor(k / 15); el("rect", { x: 170 + c * 60, y: 400 + rr * 60, width: 50, height: 50, fill: GOLD, stroke: GOLDT, "stroke-width": 2 }, s); }
        mk(Ly, "not every country reports every tonne", { x: 160, y: 700, size: 56, rot: -2, color: INK, at: Tf("s8_est", 0.2) });
        stampE(Ly, "PART ESTIMATED", { x: 1100, y: 420, rot: -6, at: Tf("s8_est", 0.6) });
      }

      // ====================== 9 · WHAT TO WATCH, AND THE CLOSE ======================
      { const Ly = layer(T("s9_where"), T("s9_three")); bgL(Ly, "stained.jpg", 0.45);
        mk(Ly, "nobody knows", { x: 200, y: 140, size: 96, rot: -3, color: INK, at: Tf("s9_where", 0.25) });
        const pc = div("card", `<div style="position:absolute;left:0;right:0;top:60px;text-align:center;font:400 72px/1.15 Anton,Oswald,sans-serif;color:${INK}">“GOLD WILL HIT<br>₹ ____ BY ____”</div>`);
        put(Ly, pc, { x: 560, y: 360, w: 800, h: 300, rot: 2, at: Tf("s9_where", 0.5) });
        stampE(Ly, "LYING", { x: 820, y: 460, rot: -8, at: Tf("s9_where", 0.82) });
      }
      { const Ly = layer(T("s9_three"), T("s9_idea")); bgL(Ly, "newsprint.jpg", 0.55);
        mk(Ly, "watch three things", { x: 160, y: 110, size: 84, rot: -2, color: INK, at: T("s9_three", 0.1) });
        const lg = ledger(Ly, { x: 420, y: 260, w: 1360, h: 350, at: Tf("s9_three", 0.4) }, "WHAT TO WATCH");
        lg.row("1 · AMERICA'S RBI", "9 DECEMBER", T("s9_one", 0.1), { color: RED });
        lg.row("2 · THE DOLLAR", "WEAKER?", T("s9_two", 0.1), { color: BLUE });
        lg.row("3 · THE SLOW MONEY", "STILL BUYING?", T("s9_slow", 0.1), { color: GREEN });
        const s = svgL(Ly), cy = (k) => 260 + 80 + k * 84 + 42;
        calendarSVG(popG(s, 320, cy(0), T("s9_one", 0.05)), 320, cy(0) - 4, 0.46, "9");
        dollarSVG(popG(s, 320, cy(1), T("s9_two", 0.05)), 320, cy(1), 0.42);
        lockerSVG(popG(s, 320, cy(2), T("s9_slow", 0.05)), 300, cy(2) - 34, 0.95);
        mk(Ly, "rates up again: bad for gold · done: helps", { x: 420, y: 680, size: 48, rot: -1.5, at: Tf("s9_one", 0.5), until: T("s9_two") });
        mk(Ly, "weaker dollar: room to breathe", { x: 420, y: 680, size: 48, rot: -1.5, at: Tf("s9_two", 0.4), until: T("s9_slow") });
        mk(Ly, "quietly collecting what others drop", { x: 420, y: 680, size: 48, rot: -1.5, at: Tf("s9_slow", 0.55) });
      }
      { // back to the gold: it pays nothing
        const Ly = layer(T("s9_idea"), T("s9_harder"));
        stampE(Ly, "GOLD: ₹0 A YEAR", { x: 560, y: 400, rot: -5, at: Tf("s9_idea", 0.6) });
        tag(Ly, "BANK: ₹0 TOO? FINE.", { x: 640, y: 700, rot: -2, at: T("s9_fine", 0.2) });
      }
      { // the close and the end card
        const Ly = layer(T("s9_harder"), DUR + 1); bgL(Ly, "newsprint.jpg", 0.55);
        const lg = ledger(Ly, { x: 140, y: 200, w: 820, h: 260, fx: "fade" }, "PER ₹100 · EVERY YEAR");
        lg.row("US BOND", "≈ ₹5", T("s9_harder", 0.2), { color: GREEN });
        lg.row("GOLD", "₹0", Tf("s9_harder", 0.35), { color: RED });
        mk(Ly, "gold has to work much harder", { x: 140, y: 560, size: 64, rot: -2, at: Tf("s9_harder", 0.55) });
        const E2 = B.s9_harder.t1;
        sv(Ly, "Why Is Gold Falling?", { x: 1060, y: 220, size: 100, w: 760, wrap: true, at: E2 + 0.3 });
        mk(Ly, "the bank pays again", { x: 1080, y: 520, size: 64, rot: -3, color: GREEN, at: E2 + 0.6 });
        px(Ly, "Educational research, not investment advice. Not SEBI-registered. Voice: AI.", { x: 140, y: 940, at: E2 + 0.5, fx: "fade" });
      }
      on((t) => POPS.forEach((p) => {
        const u = t - p.at, v = p.fx === "slam" ? E.o3(C(u / 0.24)) : E.back(C(u / 0.45));
        const sc = p.fx === "slam" ? L(1.8, 1, v) : L(0.4, 1, v);
        p.g.setAttribute("opacity", u >= 0 ? (p.fx === "slam" ? 1 : C(u / 0.2)) : 0);
        p.g.setAttribute("transform", `translate(${p.cx},${p.cy}) scale(${sc}) translate(${-p.cx},${-p.cy})`);
      }));

      // ---------- source lines (beat from, beat to, text) ----------
      const SRCS = [
        ["s1_cheap", "s1_up", "IBJA gold 999 (24K), 24 Aug and 20 Nov 2026 · our arithmetic · Footage: François Nguyen, CC BY 2.0"],
        ["s1_aug", "s1_less", "IBJA gold 999 (24K), 24 Aug and 20 Nov 2026"],
        ["s1_less", "s2_fact", "IBJA gold 999 (24K) and 916 (22K), 24 Aug and 20 Nov 2026, before GST and making charges · our arithmetic"],
        ["s1_up", "s1_why", "Photo: Stevebidmead, CC0"],
        ["s1_why", "s1_aug", "IBJA gold 999 (24K), 20 Jul – 20 Nov 2026"],
        ["s2_why", "s3_fd", "Photo: Stevebidmead, CC0"],
        ["s3_five", "s3_ago", "FRED: US 10-year bond (DGS10) ≈ 5.1%; after US price rise (DFII10) ≈ 2.9%, 13–18 Nov 2026 · ₹100 framing: our arithmetic"],
        ["s3_ago", "s3_why", "FRED: DFII10, US 10-year bond after price rise"],
        ["s3_why", "s4_rbi", "Photo: Federal Reserve (public domain)"],
        ["s4_rbi", "s4_cut", "Photos: Federal Reserve (public domain) · DesiBoy101, CC BY 4.0"],
        ["s4_sep", "s5_dollar", "Federal Reserve: statements of 16 Sep and 28 Oct 2026, minutes released 18 Nov 2026 · IBJA gold 999 (24K)"],
        ["s5_dollar", "s5_rupee", "FRED: broad dollar index (DTWEXBGS), 13 Nov 2026"],
        ["s5_rupee", "s5_price", "Photo: Rajarshi Mitra, CC BY 2.0"],
        ["s5_nov", "s5_15", "World Gold Council, India market update, 17 Nov 2026"],
        ["s5_15", "s6_run", "IBJA gold 999 (24K), 5 and 20 Nov 2026 · our arithmetic"],
        ["s6_guess", "s6_more", "Photo: DesiBoy101, CC BY 4.0"],
        ["s6_more", "s6_two", "World Gold Council, Gold Demand Trends Q3 2026 · elephants: our arithmetic, about 5 tonnes each"],
        ["s7_less", "s7_light", "World Gold Council, India Focus Q3 2026"],
        ["s7_fest", "s7_wait", "World Gold Council, India market update, 17 Nov 2026"],
        ["s7_wait", "s8_hide", "Photo: Stevebidmead, CC0 · IBJA gold 999 (24K)"],
        ["s8_units", "s8_est", "Headline: our illustration · IBJA gold 999 (24K), 24 Aug and 20 Nov 2026 · our arithmetic"],
        ["s8_est", "s9_where", "World Gold Council, Gold Demand Trends Q3 2026"],
        ["s9_one", "s9_two", "Federal Reserve: meeting calendar, 8–9 Dec 2026"],
        ["s9_idea", "s9_harder", "Footage: François Nguyen, CC BY 2.0"],
      ];
      const ILL = [["s6_run", "s6_guess"], ["s6_more", "s6_two"], ["s8_units", "s8_est"]];
      $("illus").textContent = "ILLUSTRATIVE";

      H.render = (t) => {
        for (const Ly of LAY) {
          const f = F(t, Ly.a - 0.2, Ly.b - 0.2, 0.25);
          Ly.d.style.opacity = f;
          if (f <= 0) continue;
          Ly.d.style.transform = `scale(${1 + 0.03 * C((t - Ly.a) / Math.max(1, Ly.b - Ly.a))})`;
          for (const it of Ly.items) applyFx(it, t);
        }
        for (const fn of UP) fn(t);
        for (const c of window.CLIPS) { const e = $(c.id); e.style.opacity = F(t, c.s, c.s + c.d - 0.3, 0.3); }
        let iA = 0;
        for (const [a, b] of ILL) iA = Math.max(iA, F(t, T(a, 0.2), T(b) - 0.2, 0.3));
        $("illus").style.opacity = iA;
        let sA = 0, sT = "";
        for (const [a, b, s] of SRCS) { const f = F(t, T(a, 0.3), b ? T(b) - 0.2 : 1e9, 0.3); if (f > 0) { sA = f; sT = s; } }
        // language badge (AK, 20 Nov): 15 s on, 15 s off, from 0:30 until the end card
        const lu = t - 30, ph = ((lu % 30) + 30) % 30, lOn = t >= 30 && t < T("s9_harder") - 1 ? F(ph, 0, 14.6, 0.4) : 0;
        $("lang").style.opacity = lOn; $("lang").style.transform = `scale(${L(0.85, 1, E.back(C(ph / 0.45)))})`;
        $("src").style.opacity = sA; $("srct").textContent = sA > 0 ? sT : "";
      };
      H.ready();
    </script>
