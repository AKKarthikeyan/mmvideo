<!doctype html>
<!-- India Ledger style test: Act 1 of the gold episode. Timings and every number come from act.js, written by
     tools/il_act1_build.py from scripts/india_ledger_gold.py. The "Ledger" look: ruled paper with a red margin,
     ink, one green channel accent, gold only for the metal, red only for the audit stamp. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>India Ledger Act 1</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <script src="act.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      .ledger { --bg: #f3efe6; --fg: #14161a; --muted: #4f555e; --kick: #0e7c66; --gold: #b8860b; --red: #c8431f; --card: #fbf8f0; }
      .ledger #grain { opacity: 0.1; mix-blend-mode: multiply; }
      .ledger #vig { --vig: 0.07; }
      #rules { position: absolute; inset: 0;
        background:
          linear-gradient(90deg, transparent 148px, rgba(200, 67, 31, 0.55) 148px, rgba(200, 67, 31, 0.55) 150px, transparent 150px,
                          transparent 156px, rgba(200, 67, 31, 0.55) 156px, rgba(200, 67, 31, 0.55) 158px, transparent 158px),
          repeating-linear-gradient(180deg, transparent 0 53px, rgba(14, 124, 102, 0.16) 53px 54px); }
      #stage { position: absolute; inset: 0; }
      .kicker { left: 200px; color: var(--kick); }
      #ep { position: absolute; left: 200px; top: 130px; font: 400 28px/1 Plex, monospace; color: var(--muted); letter-spacing: 0.04em; }
      #title { position: absolute; left: 200px; top: 176px; width: 1500px; font: 700 92px/1.0 Oswald, sans-serif; color: var(--fg); letter-spacing: 0.01em; }
      #tab { position: absolute; right: 90px; top: 70px; width: 520px; background: var(--card); border: 3px solid var(--fg);
        box-shadow: 8px 8px 0 rgba(20, 22, 26, 0.12); padding: 16px 22px 18px; }
      #tab .h { font: 700 28px/1 Oswald, sans-serif; letter-spacing: 0.2em; color: var(--kick); }
      #tab .l { font: 400 28px/1.2 Plex, monospace; color: var(--muted); margin-top: 14px; }
      #tab .v { font: 700 58px/1 Oswald, sans-serif; color: var(--fg); font-variant-numeric: tabular-nums; margin-top: 4px; }
      #tab .v.small { font-size: 44px; }
      #row { position: absolute; left: 200px; right: 90px; bottom: 60px; height: 110px; background: var(--card);
        border-top: 3px solid var(--fg); border-bottom: 1px solid rgba(20, 22, 26, 0.35); display: grid;
        grid-template-columns: 250px 1fr 300px 380px; align-items: center; font: 400 28px/1.2 Plex, monospace; color: var(--fg); }
      #row div { padding: 0 18px; border-right: 1px solid rgba(20, 22, 26, 0.2); white-space: nowrap; line-height: 1.4; }
      #row div:last-child { border-right: 0; font-size: 24px; color: var(--muted); white-space: normal; }
      #row .amt { font: 700 34px/1.3 Oswald, sans-serif; color: var(--kick); text-align: right; }
      #illus { position: absolute; left: 200px; bottom: 22px; font: 400 28px/1 Plex, monospace; color: var(--muted); }
      .src { right: 90px; bottom: 22px; font-size: 28px; }
    </style>
  </head>
  <body>
    <div id="root" class="ledger" data-composition-id="main" data-start="0" data-duration="55.42" data-width="1920" data-height="1080">
      <div id="rules" data-layout-ignore></div>
      <svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div class="kicker">INDIA LEDGER</div>
      <div id="ep">GOLD · EPISODE 1</div>
      <div id="title">HOW DO YOU LOSE MONEY ON GOLD THAT ONLY WENT UP?</div>
      <div id="tab">
        <div class="h">THE TAB</div>
        <div class="l">OWED ON GOLD BONDS STILL OUT</div>
        <div class="v" id="tab1">₹0</div>
        <div id="tab2w"><div class="l">CAN BE CASHED AT THE NEXT WINDOWS</div><div class="v small" id="tab2">₹0</div></div>
      </div>
      <div id="row"><div id="r0"></div><div id="r1"></div><div class="amt" id="r2"></div><div id="r3"></div></div>
      <div id="illus">ILLUSTRATION</div>
      <div class="src" id="src"></div>
    </div>
    <script>
      const D = ACT.dur, N = ACT.n;
      const H = HF.setup(55.42), E = HF.ease, F = HF.fade, L = HF.lerp, C = HF.clamp01;
      window.__timelines.main = H.tl;
      const $ = (id) => document.getElementById(id);
      const B = Object.fromEntries(ACT.beats.map((b) => [b.id, b]));
      const t0 = (id) => B[id].t0, t1 = (id) => B[id].t1;
      const GOLDT = "#7f5d07", GREYT = "#6f6a5e";
      const INK = "#14161a", GOLD = "#b8860b", GOLD2 = "#e9c46a", GREEN = "#0e7c66", RED = "#c8431f", GREY = "#b9b09b", CARD = "#fbf8f0";
      const inr = (v) => Math.round(v).toLocaleString("en-IN");
      const lakh = (cr) => `₹${(cr / 100000).toFixed(2)} LAKH CR`;
      const NS = "http://www.w3.org/2000/svg";
      const svg = $("stage");
      const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const txt = (s, attrs, parent) => { const e = el("text", attrs, parent); e.textContent = s; return e; };

      // ---------- chart: gold, ₹ per gram (RBI bond issue prices 2015-24, then RBI's latest redemption price) ----------
      const CH = el("g", {});
      const X0 = Date.parse("2015-07-01"), X1 = Date.parse("2027-03-01"), CL = 300, CR = 1640, CT = 400, CB = 900, YM = 15000;
      const X = (d) => CL + (CR - CL) * (Date.parse(d) - X0) / (X1 - X0), Y = (p) => CB - (CB - CT) * p / YM;
      for (const v of [0, 5000, 10000, 15000]) {
        el("line", { x1: CL, x2: CR, y1: Y(v), y2: Y(v), stroke: "rgba(20,22,26,0.14)", "stroke-width": v ? 1.5 : 2.5 }, CH);
        txt(`₹${v.toLocaleString("en-IN")}`, { x: CL - 18, y: Y(v) + 9, "text-anchor": "end", "font-family": "Inter", "font-size": 30, fill: "#4f555e" }, CH);
      }
      for (const yr of [2016, 2018, 2020, 2022, 2024, 2026]) txt(String(yr), { x: X(`${yr}-01-01`), y: CB + 40, "text-anchor": "middle", "font-family": "Inter", "font-size": 30, fill: "#4f555e" }, CH);
      const P = N.price;
      const issue = P.slice(0, -1);
      const path = el("path", { d: issue.map(([d, p], i) => `${i ? "L" : "M"}${X(d).toFixed(1)},${Y(p).toFixed(1)}`).join(" "),
        fill: "none", stroke: GOLD, "stroke-width": 6, "stroke-linejoin": "round", "stroke-linecap": "round" }, CH);
      const last = P[P.length - 1], li = issue[issue.length - 1];
      const dash = el("line", { x1: X(li[0]), y1: Y(li[1]), x2: X(last[0]), y2: Y(last[1]), stroke: GOLD, "stroke-width": 6, "stroke-dasharray": "14 12" }, CH);
      const dot0 = el("circle", { cx: X(P[0][0]), cy: Y(P[0][1]), r: 12, fill: GOLD, stroke: "#f3efe6", "stroke-width": 4 }, CH);
      const dot1 = el("circle", { cx: X(last[0]), cy: Y(last[1]), r: 12, fill: GOLD, stroke: "#f3efe6", "stroke-width": 4 }, CH);
      const lab0 = txt(`₹${inr(N.first)}`, { x: X(P[0][0]), y: Y(P[0][1]) - 30, "font-family": "Oswald", "font-weight": 700, "font-size": 48, fill: INK }, CH);
      const lab1 = txt(`₹${inr(N.today)}`, { x: X(last[0]) - 28, y: Y(last[1]) + 14, "text-anchor": "end", "font-family": "Oswald", "font-weight": 700, "font-size": 56, fill: INK }, CH);
      const lab1d = txt(N.today_label.toUpperCase(), { x: X(last[0]) - 150, y: Y(last[1]) + 58, "text-anchor": "end", "font-family": "Plex", "font-size": 28, fill: "#4f555e" }, CH);
      const times = txt(`×${N.x}`, { x: (X(P[0][0]) + X(last[0])) / 2 - 40, y: Y(9000), "text-anchor": "middle", "font-family": "Oswald", "font-weight": 700, "font-size": 120, fill: GREEN }, CH);
      const plen = path.getTotalLength(), dlen = Math.hypot(X(last[0]) - X(li[0]), Y(last[1]) - Y(li[1]));

      // ---------- the audit stamp (red, slams in) ----------
      const stamp = (text, cx, cy, size, rot) => {
        const g = el("g", {});
        const t = txt(text, { x: 0, y: size * 0.36, "text-anchor": "middle", "font-family": "Oswald", "font-weight": 700, "font-size": size, fill: RED, "letter-spacing": 2 }, g);
        const w = text.length * size * 0.52 + 60;
        el("rect", { x: -w / 2, y: -size * 0.75, width: w, height: size * 1.5, fill: "none", stroke: RED, "stroke-width": 8 }, g);
        g.dataset.cx = cx; g.dataset.cy = cy; g.dataset.rot = rot;
        return g;
      };
      const showStamp = (g, t, at, until = 1e9) => {
        const u = C((t - at) / 0.22), a = F(t, at, until, 0.25);
        const s = u < 1 ? L(2.4, 1, E.o3(u)) : 1;
        g.setAttribute("transform", `translate(${g.dataset.cx},${g.dataset.cy}) rotate(${g.dataset.rot}) scale(${s})`);
        g.setAttribute("opacity", a * (u > 0 ? 1 : 0));
      };

      // ---------- locker, bangle, deposit box, bond certificate (illustration) ----------
      const IL = el("g", { "data-layout-allow-overflow": "" });
      const LK = el("g", {}, IL);                                   // locker at left
      el("rect", { x: 330, y: 360, width: 380, height: 440, rx: 14, fill: "#2f3d38" }, LK);
      el("rect", { x: 350, y: 380, width: 340, height: 400, rx: 8, fill: "#1f2925" }, LK);
      const door = el("g", {}, LK);
      el("rect", { x: 0, y: 0, width: 340, height: 400, rx: 8, fill: "#3d4f48", stroke: "#22302b", "stroke-width": 4 }, door);
      el("circle", { cx: 270, cy: 200, r: 34, fill: "none", stroke: "#a7b3ad", "stroke-width": 8 }, door);
      el("line", { x1: 270, y1: 170, x2: 270, y2: 230, stroke: "#a7b3ad", "stroke-width": 8 }, door);
      const bangle = el("g", {}, IL);
      el("circle", { cx: 0, cy: 0, r: 74, fill: "none", stroke: GOLD, "stroke-width": 28 }, bangle);
      el("circle", { cx: 0, cy: 0, r: 82, fill: "none", stroke: GOLD2, "stroke-width": 5, "stroke-dasharray": "60 400", transform: "rotate(-130)" }, bangle);
      el("circle", { cx: 0, cy: 0, r: 62, fill: "none", stroke: "#8a6408", "stroke-width": 4 }, bangle);
      const BOX = el("g", {}, IL);                                  // the government's deposit box at right
      el("rect", { x: 1220, y: 420, width: 380, height: 300, rx: 10, fill: CARD, stroke: INK, "stroke-width": 5 }, BOX);
      el("rect", { x: 1310, y: 450, width: 200, height: 22, rx: 11, fill: INK }, BOX);
      txt("GOLD DEPOSIT", { x: 1410, y: 560, "text-anchor": "middle", "font-family": "Oswald", "font-weight": 700, "font-size": 50, fill: INK }, BOX);
      txt("SCHEME · 2015", { x: 1410, y: 620, "text-anchor": "middle", "font-family": "Plex", "font-size": 30, fill: "#4f555e" }, BOX);
      const amma = el("g", {}, IL);
      txt("Amma's locker", { x: 760, y: 330, "font-family": "Caveat", "font-weight": 600, "font-size": 64, fill: INK }, amma);
      el("path", { d: "M 770 345 C 740 380, 720 395, 690 410", fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, amma);
      el("path", { d: "M 690 410 l 22 -4 M 690 410 l 6 -20", fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, amma);
      const no = txt("No.", { x: 520, y: 320, "text-anchor": "middle", "font-family": "Caveat", "font-weight": 600, "font-size": 120, fill: INK }, IL);
      const CERT = el("g", { "data-layout-allow-overflow": "" }, IL);                                 // paper gold
      el("rect", { x: 0, y: 0, width: 700, height: 440, fill: CARD, stroke: GREEN, "stroke-width": 6 }, CERT);
      el("rect", { x: 18, y: 18, width: 664, height: 404, fill: "none", stroke: GREEN, "stroke-width": 2 }, CERT);
      txt("GOVERNMENT OF INDIA", { x: 350, y: 92, "text-anchor": "middle", "font-family": "Plex", "font-size": 28, fill: GREEN, "letter-spacing": 3 }, CERT);
      txt("GOLD BOND", { x: 350, y: 200, "text-anchor": "middle", "font-family": "Oswald", "font-weight": 700, "font-size": 104, fill: INK }, CERT);
      txt("PAYS WHATEVER GOLD IS WORTH LATER", { x: 350, y: 270, "text-anchor": "middle", "font-family": "Plex", "font-size": 26, fill: "#4f555e" }, CERT);
      txt("+ 2.5% A YEAR · 8 YEARS", { x: 350, y: 316, "text-anchor": "middle", "font-family": "Plex", "font-size": 26, fill: "#4f555e" }, CERT);
      el("circle", { cx: 590, cy: 360, r: 40, fill: "none", stroke: GOLD, "stroke-width": 6 }, CERT);
      txt("1 g", { x: 590, y: 372, "text-anchor": "middle", "font-family": "Oswald", "font-weight": 700, "font-size": 34, fill: GOLDT }, CERT);

      // ---------- two wrong guesses ----------
      const GU = el("g", {});
      const guess = (s, y) => {
        const g = el("g", {}, GU);
        txt(s, { x: 960, y, "text-anchor": "middle", "font-family": "Oswald", "font-weight": 700, "font-size": 110, fill: INK }, g);
        const w = s.length * 54;
        const ln = el("line", { x1: 960 - w / 2, y1: y - 36, x2: 960 + w / 2, y2: y - 36, stroke: RED, "stroke-width": 14, "stroke-linecap": "round" }, g);
        return [g, ln, w];
      };
      const g1 = guess("SOMEONE STOLE IT?", 520), g2 = guess("GOLD CRASHED?", 720);

      // ---------- last week, and what can be called in ----------
      const WK = el("g", {});
      txt("ONE BATCH, REPAID LAST WEEK", { x: 960, y: 420, "text-anchor": "middle", "font-family": "Plex", "font-size": 34, fill: "#4f555e" }, WK);
      const wkA = txt(`₹${inr(N.s3_issue)}`, { x: 700, y: 620, "text-anchor": "middle", "font-family": "Oswald", "font-weight": 700, "font-size": 150, fill: GREYT }, WK);
      const wkArr = txt("→", { x: 960, y: 610, "text-anchor": "middle", "font-family": "Inter", "font-size": 110, fill: INK }, WK);
      const wkB = txt(`₹${inr(N.s3_redeem)}`, { x: 1250, y: 620, "text-anchor": "middle", "font-family": "Oswald", "font-weight": 700, "font-size": 150, fill: GOLDT }, WK);
      txt("SOLD 2018 · A GRAM · REPAID 13 NOV 2026", { x: 960, y: 700, "text-anchor": "middle", "font-family": "Plex", "font-size": 30, fill: "#4f555e" }, WK);
      const CL_ = el("g", {});
      const clV = txt("₹0", { x: 960, y: 610, "text-anchor": "middle", "font-family": "Oswald", "font-weight": 700, "font-size": 190, fill: GREEN }, CL_);
      txt("CAN BE CASHED AT THE NEXT WINDOWS, WHENEVER HOLDERS CHOOSE", { x: 960, y: 700, "text-anchor": "middle", "font-family": "Plex", "font-size": 32, fill: "#4f555e" }, CL_);

      // ---------- tease of Act 2: 1 gram dug up, the rest bought ----------
      const DOTS = el("g", {});
      const nd = N.mined_per + 1, cols = 40, step = 34;
      const dots = [];
      for (let i = 0; i < nd; i++) {
        const r = Math.floor(i / cols), c = i % cols;
        dots.push(el("circle", { cx: 300 + c * step, cy: 400 + r * step, r: 12, fill: i === 0 ? GOLD : GREY }, DOTS));
      }
      txt("1 GRAM DUG UP IN INDIA", { x: 300, y: 845, "font-family": "Oswald", "font-weight": 700, "font-size": 40, fill: GOLDT }, DOTS);
      txt(`${N.mined_per} GRAMS BOUGHT FROM ABROAD`, { x: 1626, y: 845, "text-anchor": "end", "font-family": "Oswald", "font-weight": 700, "font-size": 40, fill: "#4f555e" }, DOTS);

      const stLoss = stamp("THE GOVERNMENT LOST", 900, 590, 70, -5);
      const stUp = stamp(`GOLD UP ×${N.x} · GOVERNMENT LOST`, 760, 275, 62, -4);
      const stPct = stamp(`+${N.s3_pct}%`, 1460, 800, 84, -7);

      // ---------- ledger rows (date · entry · amount · source) ----------
      const ROWS = [
        ["bet", "paper", ["5 NOV 2015", "GOLD BONDS + DEPOSIT SCHEME LAUNCHED", "2 PLANS", "Ministry of Finance / RBI"]],
        ["owes", "not", [N.today_label.toUpperCase(), "OWED ON GOLD BONDS STILL OUT", lakh(N.owed_cr), `RBI tranche data · our arithmetic at RBI's ₹${inr(N.today)}/g`]],
        ["week", "call", ["13 NOV 2026", "SGB 2018-19 SERIES III REPAID", `+${N.s3_pct}%`, `RBI redemption ₹${inr(N.s3_redeem)}/g vs issue ₹${inr(N.s3_issue)}/g`]],
        ["call", "next", ["TODAY", "BONDS PAST 5 YEARS: CASHABLE", `₹${inr(N.early_cr)} CR`, "RBI tranche data · our arithmetic at today's price"]],
      ];
      const SRCS = [
        ["hook", "bet", `Gold, ₹ per gram: RBI issue price of each of the 67 gold bonds, then RBI's redemption price, ${N.today_label}`],
        ["up", "week", `RBI · ₹${inr(N.first)} (Nov 2015) → ₹${inr(N.today)} (${N.today_label}) · our arithmetic`],
        ["next", null, "Ministry of Mines, 2024–25 · DGCIS FY 2025–26 · our arithmetic"],
      ];

      H.render = (t) => {
        const T = (id, o = 0) => B[id].t0 + o;
        // header
        $("title").style.opacity = F(t, 0.2, T("bet") - 0.3, 0.4);
        // A + F: the chart
        const aChart = Math.max(F(t, 0.3, T("bet") - 0.3, 0.4), F(t, T("up") - 0.2, T("week") - 0.3, 0.4));
        CH.setAttribute("opacity", aChart);
        CH.setAttribute("transform", `translate(0,${t < T("bet") ? 0 : -20})`);
        const draw = t < T("bet") ? E.io2((t - 0.5) / Math.max(1, t1("hook") - 0.6)) : 1;
        const pd = C(draw / 0.82), dd = C((draw - 0.82) / 0.18);
        path.setAttribute("stroke-dasharray", `${plen * pd} ${plen}`);
        dash.setAttribute("opacity", dd > 0 ? 1 : 0);
        dash.setAttribute("x2", L(X(li[0]), X(last[0]), dd)); dash.setAttribute("y2", L(Y(li[1]), Y(last[1]), dd));
        dot1.setAttribute("opacity", dd >= 1 ? 1 : 0); lab1.setAttribute("opacity", dd >= 1 ? 1 : 0); lab1d.setAttribute("opacity", dd >= 1 ? 1 : 0);
        lab0.setAttribute("opacity", pd > 0.02 ? 1 : 0); dot0.setAttribute("opacity", pd > 0 ? 1 : 0);
        times.setAttribute("opacity", F(t, T("up", 0.2), 1e9, 0.3));
        showStamp(stLoss, t, T("way", 0.5), T("bet") - 0.3);
        showStamp(stUp, t, T("up", 0.35), T("week") - 0.3);
        // B + C: locker, bangle, deposit box, certificate
        const aIl = F(t, T("bet") - 0.1, T("not") - 0.3, 0.4);
        IL.setAttribute("opacity", aIl);
        $("illus").style.opacity = aIl;
        const open = E.o3((t - T("bet", 0.6)) / 0.7) * (1 - E.o3((t - T("no", 0.05)) / 0.18));
        const shake = t > T("no", 0.23) && t < T("no", 0.6) ? Math.sin((t - T("no")) * 90) * 6 * (1 - C((t - T("no", 0.23)) / 0.37)) : 0;
        door.setAttribute("transform", `translate(${350 + shake},380) scale(${L(1, 0.06, open)},1)`);
        LK.setAttribute("transform", `translate(${shake},0)`);
        const go = E.io2((t - T("ask", 0.3)) / 1.3), back = E.back((t - T("no", -0.05)) / 0.35, 1.2);
        const bx = L(520, 1410, go * (1 - back)), by = L(580, 470, go * (1 - back)) - Math.sin(Math.PI * go * (1 - back)) * 120;
        bangle.setAttribute("transform", `translate(${bx},${by}) scale(${L(0.9, 1, open)})`);
        bangle.setAttribute("opacity", Math.max(open, go * (1 - back)) > 0.05 || t < T("no") ? 1 : 0);
        BOX.setAttribute("opacity", F(t, T("ask"), T("paper", 0.2), 0.35));
        no.setAttribute("opacity", F(t, T("no", 0.15), T("paper"), 0.15));
        amma.setAttribute("opacity", F(t, T("bet", 0.58 * (t1("bet") - t0("bet"))), T("paper", 0.6), 0.35));
        const cin = E.o3((t - T("paper", 0.2)) / 0.7);
        CERT.setAttribute("transform", `translate(${L(2160, 960, cin)},${360}) rotate(${L(8, -2, cin)})`);
        // E: two wrong guesses, struck out on the word
        GU.setAttribute("opacity", F(t, T("not") - 0.05, T("up") - 0.2, 0.3));
        const half = (t1("not") - t0("not")) / 2;
        for (const [[g, ln, w], at] of [[g1, T("not", 0.1)], [g2, T("not", half + 0.1)]]) {
          g.setAttribute("opacity", F(t, at - 0.1, 1e9, 0.25));
          const u = E.o2((t - at - half * 0.55) / 0.3);
          ln.setAttribute("x2", 960 - w / 2 + w * u);
        }
        // G: last week
        WK.setAttribute("opacity", F(t, T("week") - 0.1, T("call") - 0.25, 0.3));
        const wd = t1("week") - t0("week");
        wkA.setAttribute("opacity", F(t, T("week", 0.25 * wd), 1e9, 0.3));
        wkArr.setAttribute("opacity", F(t, T("week", 0.5 * wd), 1e9, 0.3)); wkB.setAttribute("opacity", F(t, T("week", 0.62 * wd), 1e9, 0.3));
        showStamp(stPct, t, T("week", 0.86 * wd), T("call") - 0.25);
        // H: what can be called in
        CL_.setAttribute("opacity", F(t, T("call") - 0.1, T("next") - 0.25, 0.3));
        const cd = t1("call") - t0("call");
        clV.textContent = `₹${inr(N.early_cr * E.io2((t - T("call", 0.3)) / (0.8 * cd)))} CRORE`;
        // I: dots
        DOTS.setAttribute("opacity", F(t, T("next") - 0.1, 1e9, 0.3));
        const shown = Math.floor(nd * E.o2((t - T("next", 0.3)) / (t1("next") - t0("next"))));
