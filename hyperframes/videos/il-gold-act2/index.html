<!doctype html>
<!-- India Ledger, gold episode, Act 2: "The problem India couldn't dig its way out of". Timings and every number come from
     act.js, written by tools/il_act2_build.py from scripts/india_ledger_gold.py and the DGCIS file. Same "Ledger" look as
     Act 1: ruled paper with a red margin, ink, one green channel accent, gold only for the metal, red only for the stamp.
     The entry-point map places dots by latitude and longitude and draws no borders. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>India Ledger Act 2</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <script src="act.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      .ledger { --bg: #f3efe6; --fg: #14161a; --muted: #4f555e; --kick: #0e7c66; --gold: #b8860b; --red: #c8431f; --card: #fbf8f0; }
      .ledger #grain { opacity: 0.1; mix-blend-mode: multiply; }
      .ledger #vig { --vig: 0.07; }
      #rules { position: absolute; inset: 0;
        background:
          linear-gradient(90deg, transparent 148px, rgba(200, 67, 31, 0.55) 148px, rgba(200, 67, 31, 0.55) 150px, transparent 150px,
                          transparent 156px, rgba(200, 67, 31, 0.55) 156px, rgba(200, 67, 31, 0.55) 158px, transparent 158px),
          repeating-linear-gradient(180deg, transparent 0 53px, rgba(14, 124, 102, 0.16) 53px 54px); }
      #stage { position: absolute; inset: 0; }
      .kicker { left: 200px; color: var(--kick); }
      #ep { position: absolute; left: 200px; top: 130px; font: 400 28px/1 Plex, monospace; color: var(--muted); letter-spacing: 0.04em; }
      #title { position: absolute; left: 200px; top: 176px; width: 1060px; font: 700 76px/1.0 Oswald, sans-serif; color: var(--fg); letter-spacing: 0.01em; }
      #tab { position: absolute; right: 90px; top: 70px; width: 520px; background: var(--card); border: 3px solid var(--fg);
        box-shadow: 8px 8px 0 rgba(20, 22, 26, 0.12); padding: 16px 22px 18px; }
      #tab .h { font: 700 28px/1 Oswald, sans-serif; letter-spacing: 0.2em; color: var(--kick); }
      #tab .l { font: 400 28px/1.2 Plex, monospace; color: var(--muted); margin-top: 12px; }
      #tab .v { font: 700 50px/1 Oswald, sans-serif; color: var(--fg); font-variant-numeric: tabular-nums; margin-top: 4px; }
      #tab .v.small { font-size: 42px; }
      #row { position: absolute; left: 200px; right: 90px; bottom: 60px; height: 110px; background: var(--card);
        border-top: 3px solid var(--fg); border-bottom: 1px solid rgba(20, 22, 26, 0.35); display: grid;
        grid-template-columns: 250px 1fr 300px 380px; align-items: center; font: 400 28px/1.2 Plex, monospace; color: var(--fg); }
      #row div { padding: 0 18px; border-right: 1px solid rgba(20, 22, 26, 0.2); white-space: nowrap; line-height: 1.4; overflow: hidden; }
      #row div:last-child { border-right: 0; font-size: 28px; color: var(--muted); white-space: normal; }
      #row .amt { font: 700 34px/1.3 Oswald, sans-serif; color: var(--kick); text-align: right; }
      #illus { position: absolute; left: 200px; bottom: 22px; font: 400 28px/1 Plex, monospace; color: var(--muted); }
      .src { right: 90px; bottom: 22px; font-size: 28px; max-width: 1280px; text-align: right; }
    </style>
  </head>
  <body>
    <div id="root" class="ledger" data-composition-id="main" data-start="0" data-duration="103.42" data-width="1920" data-height="1080">
      <div id="rules" data-layout-ignore></div>
      <svg id="stage" width="1920" height="1080" viewBox="0 0 1920 1080"></svg>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div class="kicker">INDIA LEDGER</div>
      <div id="ep">GOLD · EPISODE 1 · ACT 2</div>
      <div id="title">THE PROBLEM INDIA COULDN'T DIG ITS WAY OUT OF</div>
      <div id="tab">
        <div class="h">THE TAB</div>
        <div class="l">OWED ON GOLD BONDS STILL OUT</div>
        <div class="v" id="tab1"></div>
        <div id="tab2w"><div class="l">GOLD IMPORTS, FY 2025–26</div><div class="v small" id="tab2">₹0</div></div>
      </div>
      <div id="row"><div id="r0"></div><div id="r1"></div><div class="amt" id="r2"></div><div id="r3"></div></div>
      <div id="illus">ILLUSTRATION</div>
      <div class="src" id="src"></div>
    </div>
    <script>
      const N = ACT.n;
      const H = HF.setup(103.42), E = HF.ease, F = HF.fade, L = HF.lerp, C = HF.clamp01;
      window.__timelines.main = H.tl;
      const $ = (id) => document.getElementById(id);
      const B = Object.fromEntries(ACT.beats.map((b) => [b.id, b]));
      const t0 = (id) => B[id].t0, t1 = (id) => B[id].t1, dur = (id) => B[id].t1 - B[id].t0;
      const T = (id, o = 0) => B[id].t0 + o, Tf = (id, f) => B[id].t0 + f * (B[id].t1 - B[id].t0);
      const INK = "#14161a", MUTED = "#4f555e", GOLD = "#b8860b", GOLDT = "#7f5d07", GREEN = "#0e7c66", RED = "#c8431f",
            GREY = "#b9b09b", GREYT = "#6f6a5e", CARD = "#fbf8f0";
      const inr = (v) => Math.round(v).toLocaleString("en-IN");
      const lakh = (cr, d = 2) => `₹${(cr / 100000).toFixed(d)} LAKH CR`;
      const NS = "http://www.w3.org/2000/svg";
      const svg = $("stage");
      const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      const txt = (s, attrs, parent) => { const e = el("text", attrs, parent); e.textContent = s; return e; };
      const OS = { "font-family": "Oswald", "font-weight": 700 }, PX = { "font-family": "Plex" }, CV = { "font-family": "Caveat", "font-weight": 600 };
      const note = (s, x, y, size, parent, arrow) => {     // hand-lettered note, optional arrow [x1, y1, x2, y2]
        const g = el("g", {}, parent);
        txt(s, { x, y, ...CV, "font-size": size, fill: INK }, g);
        if (arrow) {
          const [a, b, c, d] = arrow;
          el("path", { d: `M ${a} ${b} Q ${(a + c) / 2} ${Math.min(b, d) - 24}, ${c} ${d}`, fill: "none", stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, g);
          const ang = Math.atan2(d - b, c - a);
          for (const s2 of [-1, 1]) el("line", { x1: c, y1: d, x2: c - 20 * Math.cos(ang + s2 * 0.5), y2: d - 20 * Math.sin(ang + s2 * 0.5), stroke: INK, "stroke-width": 4, "stroke-linecap": "round" }, g);
        }
        return g;
      };
      const stamp = (text, cx, cy, size, rot) => {
        const g = el("g", {});
        txt(text, { x: 0, y: size * 0.36, "text-anchor": "middle", ...OS, "font-size": size, fill: RED, "letter-spacing": 2 }, g);
        const w = text.length * size * 0.52 + 60;
        el("rect", { x: -w / 2, y: -size * 0.75, width: w, height: size * 1.5, fill: "none", stroke: RED, "stroke-width": 8 }, g);
        Object.assign(g.dataset, { cx, cy, rot });
        return g;
      };
      const showStamp = (g, t, at, until = 1e9) => {
        const u = C((t - at) / 0.22), a = F(t, at, until, 0.25);
        g.setAttribute("transform", `translate(${g.dataset.cx},${g.dataset.cy}) rotate(${g.dataset.rot}) scale(${u < 1 ? L(2.4, 1, E.o3(u)) : 1})`);
        g.setAttribute("opacity", a * (u > 0 ? 1 : 0));
      };

      // ---------- A. the scale: 1 gram dug up against every gram bought ----------
      const SC = el("g", {});
      const PV = [960, 440], HALF = 400, DROP = 160, PAN = 300;
      el("rect", { x: 830, y: 862, width: 260, height: 22, rx: 6, fill: INK }, SC);
      el("rect", { x: 950, y: PV[1], width: 20, height: 425, fill: INK }, SC);
      el("circle", { cx: PV[0], cy: PV[1], r: 18, fill: INK }, SC);
      const beam = el("rect", { x: -HALF, y: -7, width: 2 * HALF, height: 14, rx: 7, fill: INK }, SC);
      const mkPan = () => {
        const g = el("g", {}, SC);
        const s1 = el("line", { stroke: INK, "stroke-width": 3 }, g), s2 = el("line", { stroke: INK, "stroke-width": 3 }, g);
        const p = el("g", {}, g);
        el("path", { d: `M ${-PAN / 2} 0 Q 0 46 ${PAN / 2} 0 Z`, fill: CARD, stroke: INK, "stroke-width": 5 }, p);
        return { g, s1, s2, p };
      };
      const panL = mkPan(), panR = mkPan();
      const gram = el("rect", { x: -6, y: -14, width: 12, height: 12, fill: GOLD, stroke: GOLDT, "stroke-width": 1.5 }, panL.p);
      const pile = [];
      const PC = 30, PS = 9.4;
      for (let i = 0; i < N.mined_per; i++) {
        const r = Math.floor(i / PC), c = i % PC;
        pile.push(el("rect", { x: -PC * PS / 2 + c * PS + 0.7, y: -4 - (r + 1) * PS, width: PS - 1.4, height: PS - 1.4, fill: GREY }, panR.p));
      }
      const labL = txt("1 g DUG UP IN INDIA", { x: 0, y: 0, "text-anchor": "middle", ...OS, "font-size": 40, fill: GOLDT }, SC);
      const labR = txt(`${N.mined_per} g BOUGHT FROM ABROAD`, { x: 0, y: 0, "text-anchor": "middle", ...OS, "font-size": 40, fill: INK }, SC);
      const noteG = note("one gram", 0, 0, 52, SC);
      const placePan = (pan, ex, ey) => {
        pan.p.setAttribute("transform", `translate(${ex},${ey + DROP})`);
        for (const [s, dx] of [[pan.s1, -PAN / 2], [pan.s2, PAN / 2]]) {
          s.setAttribute("x1", ex); s.setAttribute("y1", ey); s.setAttribute("x2", ex + dx); s.setAttribute("y2", ey + DROP);
        }
      };

      // ---------- B. mined vs imported, tonnes ----------
      const MI = el("g", {});
      const BX = 260, BW = 1380;
      txt("MINED IN INDIA, 2024–25", { x: BX, y: 440, ...PX, "font-size": 34, fill: MUTED }, MI);
      const mBar = el("rect", { x: BX, y: 462, height: 64, width: Math.max(4, BW * N.mined_t / N.t26), fill: GOLD }, MI);
      const mVal = txt(`${N.mined_t.toFixed(1)} TONNES`, { x: BX + 30, y: 512, ...OS, "font-size": 56, fill: GOLDT }, MI);
      txt("IMPORTED, FY 2025–26", { x: BX, y: 640, ...PX, "font-size": 34, fill: MUTED }, MI);
      const iBar = el("rect", { x: BX, y: 662, height: 64, width: 0, fill: GREY }, MI);
      const iVal = txt("", { x: BX + 30, y: 712, ...OS, "font-size": 56, fill: INK }, MI);
      const mNote = note("that's all of it", BX + 330, 600, 50, MI, [BX + 320, 584, BX + 16, 534]);

      // ---------- C. India's biggest imports ----------
      const TP = el("g", {});
      const RX = 600, RW = 540, RY = 360, RS = 84, vmax = N.top[0][1];
      const bars = N.top.map(([name, cr, pct], i) => {
        const y = RY + i * RS, gold = name === "Gold";
        txt(`#${i + 1}`, { x: 200, y: y + 44, ...OS, "font-size": 40, fill: gold ? GOLDT : MUTED }, TP);
        txt(name, { x: 270, y: y + 44, "font-family": "Inter", "font-weight": gold ? 600 : 400, "font-size": 34, fill: gold ? INK : MUTED }, TP);
        const r = el("rect", { x: RX, y: y + 8, height: 50, width: 0, rx: 4, fill: gold ? GOLD : GREY }, TP);
        const v = txt(`₹${(cr / 100000).toFixed(2)} L CR · ${pct}%`, { x: RX + 16, y: y + 46, ...OS, "font-size": 36, fill: gold ? GOLDT : INK }, TP);
        return { r, v, w: RW * cr / vmax, gold };
      });
      const nOil = note("runs the country", 1540, RY + 44, 42, TP), nWed = note("runs the weddings", 1540, RY + RS + 44, 42, TP);

      // ---------- D. more money, less gold: two small charts, never one dual axis ----------
      const MM = el("g", {});
      const panel = (x0, title, vals, color, fmt) => {
        const g = el("g", {}, MM), base = 830, top = 500, slot = 144, bw = 86, mx = Math.max(...vals);
        txt(title, { x: x0, y: 380, ...PX, "font-size": 32, fill: MUTED }, g);
        el("line", { x1: x0, x2: x0 + slot * vals.length, y1: base, y2: base, stroke: "rgba(20,22,26,0.3)", "stroke-width": 2 }, g);
        const items = vals.map((v, i) => {
          const x = x0 + i * slot + (slot - bw) / 2, h = (base - top) * v / mx;
          const r = el("rect", { x, y: base - h, width: bw, height: h, rx: 4, fill: GREY }, g);
          const lv = txt(fmt(v), { x: x + bw / 2, y: base - h - 14, "text-anchor": "middle", ...OS, "font-size": 34, fill: INK }, g);
          txt("FY" + N.fy[i][0].slice(-2), { x: x + bw / 2, y: base + 38, "text-anchor": "middle", "font-family": "Inter", "font-size": 28, fill: MUTED }, g);
          return { r, lv, h, base, color };
        });
        return items;
      };
      const tPan = panel(220, "TONNES IMPORTED", N.fy.map((r) => r[1]), INK, (v) => inr(v));
      const mPan = panel(1080, "PAID, ₹ LAKH CRORE", N.fy.map((r) => r[2]), GREEN, (v) => (v / 100000).toFixed(2));
      const stMoney = stamp(`+${N.money_pct}% MONEY`, 1310, 452, 52, -4), stGold = stamp(`${N.tonnes_pct}% GOLD`.replace("-", "−"), 520, 452, 52, 3);
      const nVeg = note("same bag, bigger bill", 690, 305, 54, MM);

      // ---------- E. where it lands: entry points placed by latitude and longitude (no borders drawn) ----------
      const MP = el("g", {});
      const MX = (lon) => 1210 + (lon - 68) * 21, MY = (lat) => 890 - (lat - 8) * 21;
      const main = ["Delhi airport", "Mumbai airport", "Chennai free-trade warehouse", "GIFT City SEZ"];
      const pdots = N.ports.map(([name, lon, lat, sh]) => {
        const hi = main.includes(name), x = MX(lon), y = MY(lat);
        const c = el("circle", { cx: x, cy: y, r: 0, fill: hi ? GREEN : GREY, "fill-opacity": hi ? 0.85 : 0.9, stroke: CARD, "stroke-width": 3 }, MP);
        return { c, r: 9 * Math.sqrt(sh), name, sh, x, y, hi };
      });
      const lab = (name, dx, anchor) => {
        const d = pdots.find((p) => p.name === name);
        const g = el("g", {}, MP);
        txt(name.toUpperCase(), { x: d.x + dx, y: d.y - 4, "text-anchor": anchor, ...PX, "font-size": 28, fill: MUTED }, g);
        txt(`${d.sh}%`, { x: d.x + dx, y: d.y + 34, "text-anchor": anchor, ...OS, "font-size": 40, fill: INK }, g);
        return g;
      };
      const pl = [lab("Delhi airport", 70, "start"), lab("Mumbai airport", -60, "end"), lab("Chennai free-trade warehouse", -50, "end"), lab("GIFT City SEZ", -40, "end")];
      const delhi = pdots.find((p) => p.name === "Delhi airport");
      const ring = el("circle", { cx: delhi.x, cy: delhi.y, r: 0, fill: "none", stroke: GREEN, "stroke-width": 4 }, MP);
      const bigA = txt(`${N.air_pct}%`, { x: 200, y: 560, ...OS, "font-size": 170, fill: GREEN }, MP);
      const bigAs = txt("OF IT, BY VALUE, LANDS AT AN AIRPORT", { x: 204, y: 625, ...PX, "font-size": 30, fill: MUTED }, MP);
      const bigD = txt(`${delhi.sh}%`, { x: 200, y: 560, ...OS, "font-size": 170, fill: GREEN }, MP);
      const bigDs = txt("LANDS AT DELHI AIRPORT ALONE", { x: 204, y: 625, ...PX, "font-size": 30, fill: MUTED }, MP);
      const CO = el("g", {}, MP);                                   // shipped from: arcs into India
      const arcs = N.countries.map(([name, sh], i) => {
        const y = 400 + i * 96, hi = name === "Switzerland" || name === "UAE";
        txt(name.toUpperCase(), { x: 200, y, ...OS, "font-size": 44, fill: hi ? INK : MUTED }, CO);
        txt(`${sh}%`, { x: 200, y: y + 40, ...OS, "font-size": 36, fill: hi ? GREEN : GREYT }, CO);
        const x0 = 560, y0 = y - 12, x1 = MX(77.5), y1 = MY(20.5);
        const p = el("path", { d: `M ${x0} ${y0} C ${x0 + 260} ${y0 - 120}, ${x1 - 280} ${y1 - 140}, ${x1} ${y1}`, fill: "none",
          stroke: hi ? GREEN : GREY, "stroke-width": 2 + sh * 0.45, "stroke-linecap": "round", "stroke-opacity": 0.8 }, CO);
        return { p, len: 0 };
      });
      txt("COUNTRY IT WAS SHIPPED FROM", { x: 200, y: 800, ...PX, "font-size": 28, fill: MUTED }, CO);

      // ---------- F. paid in dollars ----------
      const DL = el("g", {});
      txt(`₹${(N.cr26 / 100000).toFixed(2)} LAKH CRORE`, { x: 960, y: 440, "text-anchor": "middle", ...OS, "font-size": 64, fill: GREYT }, DL);
      const dV = txt("$0", { x: 960, y: 640, "text-anchor": "middle", ...OS, "font-size": 200, fill: GREEN }, DL);
      txt("INDIA'S GOLD IMPORTS IN FY 2025–26, PAID IN DOLLARS", { x: 960, y: 720, "text-anchor": "middle", ...PX, "font-size": 32, fill: MUTED }, DL);

      // ---------- G. 5 Nov 2015: three schemes, two plans, one target ----------
      const PL = el("g", {});
      const date = txt("5 NOV 2015", { x: 960, y: 0, "text-anchor": "middle", ...OS, "font-size": 200, fill: INK }, PL);
      const tags = ["GOLD MONETISATION SCHEME", "SOVEREIGN GOLD BONDS", "INDIA GOLD COINS"].map((s, i) => {
        const g = el("g", {}, PL), x = 380 + i * 580;
        el("rect", { x: x - 260, y: 500, width: 520, height: 80, fill: CARD, stroke: INK, "stroke-width": 3 }, g);
        txt(s, { x, y: 552, "text-anchor": "middle", ...PX, "font-size": 30, fill: INK }, g);
        return g;
      });
      const card = (x, head, name, line) => {
        const g = el("g", {}, PL);
        el("rect", { x, y: 470, width: 600, height: 330, fill: CARD, stroke: GREEN, "stroke-width": 5 }, g);
        txt(head, { x: x + 40, y: 560, ...OS, "font-size": 84, fill: GREEN }, g);
        txt(name, { x: x + 40, y: 615, ...PX, "font-size": 28, fill: MUTED }, g);
        txt(line[0], { x: x + 40, y: 700, ...CV, "font-size": 54, fill: INK }, g);
        txt(line[1], { x: x + 40, y: 760, ...CV, "font-size": 54, fill: INK }, g);
        return g;
      };
      const cA = card(220, "PLAN A", "GOLD MONETISATION SCHEME", ["borrow the gold", "that's already here"]);
      const cB = card(1100, "PLAN B", "SOVEREIGN GOLD BONDS", ["sell something that", "feels like gold"]);
      const LK = el("g", {}, PL);                                  // Amma's locker again, small, between the plans
      el("rect", { x: 870, y: 620, width: 180, height: 210, rx: 10, fill: "#2f3d38" }, LK);
      el("rect", { x: 884, y: 634, width: 152, height: 182, rx: 6, fill: "#3d4f48", stroke: "#22302b", "stroke-width": 3 }, LK);
      el("circle", { cx: 1000, cy: 725, r: 18, fill: "none", stroke: "#a7b3ad", "stroke-width": 5 }, LK);
      const tgt = note("your mother", 822, 448, 64, PL);
      const arA = el("path", { d: "M 822 700 Q 846 720 866 728", fill: "none", stroke: INK, "stroke-width": 5, "stroke-linecap": "round" }, PL);
      const arB = el("path", { d: "M 1098 700 Q 1074 720 1054 728", fill: "none", stroke: INK, "stroke-width": 5, "stroke-linecap": "round" }, PL);

      // ---------- ledger rows (date · entry · amount · source) and source lines ----------
      const ROWS = [
        ["second", "dear", ["FY 2025–26", "GOLD IMPORTS · RANK #2", lakh(N.cr26), `DGCIS · ${N.share26}% of all imports`]],
        ["pct", "fly", ["FY22 → FY26", "GOLD IMPORTS: MORE MONEY, LESS GOLD", `+${N.money_pct}% · ${N.tonnes_pct}%`.replace("-", "−"), "DGCIS · our arithmetic"]],
        ["delhi", "swiss", ["FY 2025–26", "GOLD LANDING AT DELHI AIRPORT", `${delhi.sh}%`, "DGCIS port data · our arithmetic"]],
        ["swiss", "dollar", ["FY 2025–26", "SHIPPED FROM SWITZERLAND + UAE", `${N.swiss_uae}%`, "DGCIS · country of consignment"]],
        ["dollar", "decide", ["FY 2025–26", "GOLD IMPORTS, IN DOLLARS", `$${N.usd_bn} BN`, "DGCIS (US$ value of each import)"]],
        ["same", "planA", ["5 NOV 2015", "THREE GOLD SCHEMES LAUNCHED", "3", "PIB, Ministry of Finance, 5 Nov 2015"]],
      ];
      const SRCS = [
        ["gram", "second", "Ministry of Mines, 2024–25 (1,627 kg) · DGCIS FY 2025–26 · our arithmetic"],
        ["dear", "pct", "DGCIS principal commodity data, FY 2021–22 to FY 2025–26"],
        ["fly", "delhi", "DGCIS ports, FY 2025–26 · our arithmetic · dots by latitude and longitude, no borders drawn"],
        ["planA", null, "PIB, Ministry of Finance, 5 Nov 2015 · third scheme (gold coins) left out"],
      ];

      const drift = (g, a, b) => { const u = C((t_ - a) / Math.max(1, b - a)); g.setAttribute("transform", `translate(960,600) scale(${1 + 0.03 * u}) translate(-960,-600)`); };
      let t_ = 0;
      H.render = (t) => {
        t_ = t;
        drift(MI, T("mines"), T("second")); drift(TP, T("second"), T("dear")); drift(MM, T("dear"), T("fly"));
        drift(MP, T("fly"), T("dollar")); drift(DL, T("dollar"), T("decide")); drift(PL, T("decide"), ACT.dur);
        $("title").style.opacity = F(t, 0.2, T("mines") - 0.3, 0.4);
        // the tab: carries Act 1's debt; the import bill joins on "second"
        $("tab1").textContent = lakh(N.owed_cr ?? 0);
        $("tab").style.opacity = N.owed_cr ? 1 : 0;
        $("tab2w").style.display = t < Tf("second", 0.3) ? "none" : "block";
        $("tab2").textContent = lakh(N.cr26 * E.o3((t - Tf("second", 0.3)) / 1.6));

        // A: the scale tips as the bought grams pile up
        SC.setAttribute("opacity", F(t, 0.4, T("mines") - 0.3, 0.4));
        const g1 = E.io2((t - Tf("gram", 0.35)) / Math.max(1, 0.62 * dur("gram")));
        const shown = Math.floor(N.mined_per * g1);
        pile.forEach((p, i) => p.setAttribute("opacity", i < shown ? 1 : 0));
        const a = 13 * Math.PI / 180 * E.o3(g1);
        const lx = PV[0] - HALF * Math.cos(a), ly = PV[1] - HALF * Math.sin(a), rx = PV[0] + HALF * Math.cos(a), ry = PV[1] + HALF * Math.sin(a);
        beam.setAttribute("transform", `translate(${PV[0]},${PV[1]}) rotate(${a * 180 / Math.PI})`);
        placePan(panL, lx, ly); placePan(panR, rx, ry);
        gram.setAttribute("opacity", t > Tf("gram", 0.15) ? 1 : 0);
        labL.setAttribute("x", lx); labL.setAttribute("y", ly + DROP + 90); labL.setAttribute("opacity", F(t, Tf("gram", 0.2), 1e9, 0.3));
        labR.setAttribute("x", rx); labR.setAttribute("y", ry + DROP + 90); labR.setAttribute("opacity", F(t, Tf("gram", 0.85), 1e9, 0.3));
        noteG.setAttribute("transform", `translate(${lx - PAN / 2 - 215},${ly + DROP + 12})`);
        noteG.setAttribute("opacity", F(t, Tf("gram", 0.15), 1e9, 0.3));

        // B: a sliver against a bar
        MI.setAttribute("opacity", F(t, T("mines") - 0.1, T("second") - 0.25, 0.3));
        const ib = E.io2((t - Tf("mines", 0.55)) / 1.2);
        iBar.setAttribute("width", BW * ib);
        iVal.textContent = `${inr(N.t26 * ib)} TONNES`;
        iVal.setAttribute("opacity", ib > 0.02 ? 1 : 0);
        iVal.setAttribute("x", Math.min(BX + BW * ib + 24, BX + BW - 330));
        iVal.setAttribute("fill", BW * ib > 400 ? INK : INK);
        mVal.setAttribute("opacity", F(t, Tf("mines", 0.1), 1e9, 0.3));
        mNote.setAttribute("opacity", F(t, Tf("mines", 0.3), 1e9, 0.3));

        // C: imports ranked, gold lands second
        TP.setAttribute("opacity", F(t, T("second") - 0.1, T("dear") - 0.25, 0.3));
        bars.forEach((b, i) => {
          const at = b.gold ? Tf("second", 0.3) : T("second", 0.1 + i * 0.12);
          const u = E.o3((t - at) / (b.gold ? 0.9 : 0.6));
          b.r.setAttribute("width", b.w * u);
          b.v.setAttribute("x", RX + b.w * u + 16);
          b.v.setAttribute("opacity", u > 0.9 ? 1 : 0);
        });
        nOil.setAttribute("opacity", F(t, Tf("oil", 0.05), 1e9, 0.25));
        nWed.setAttribute("opacity", F(t, Tf("oil", 0.5), 1e9, 0.25));

        // D: four years, more money for less gold
        MM.setAttribute("opacity", F(t, T("dear") - 0.1, T("fly") - 0.25, 0.3));
        const grow = E.o3((t - T("dear", 0.1)) / 1.0);
        for (const P of [tPan, mPan]) P.forEach((b, i) => {
          const h = b.h * grow;
          b.r.setAttribute("y", b.base - h); b.r.setAttribute("height", h);
          b.lv.setAttribute("y", b.base - h - 14);
          const lit = (i === 0 && t > Tf("dear", 0.35)) || (i === P.length - 1 && t > Tf("less", 0.2));
          b.r.setAttribute("fill", lit ? b.color : GREY);
          b.lv.setAttribute("opacity", grow > 0.95 ? (lit || t < Tf("dear", 0.35) ? 1 : 0.45) : 0);
        });
        showStamp(stMoney, t, Tf("pct", 0.05), T("fly") - 0.25);
        showStamp(stGold, t, Tf("pct", 0.5), T("fly") - 0.25);
        nVeg.setAttribute("opacity", F(t, Tf("veg", 0.1), 1e9, 0.3));

        // E: entry points, then where it was shipped from
        MP.setAttribute("opacity", F(t, T("fly") - 0.1, T("dollar") - 0.25, 0.3));
        pdots.forEach((d, i) => d.c.setAttribute("r", d.r * E.back((t - T("fly", 0.3 + i * 0.08)) / 0.5, 1.4)));
        pl.forEach((g, i) => g.setAttribute("opacity", F(t, T("fly", 0.9 + i * 0.12), 1e9, 0.3) * (t > T("swiss", 0.1) ? 0.2 : 1)));
        bigA.setAttribute("opacity", F(t, Tf("fly", 0.55), T("delhi"), 0.3)); bigAs.setAttribute("opacity", F(t, Tf("fly", 0.55), T("delhi"), 0.3));
        const dOn = F(t, Tf("delhi", 0.3), T("swiss") - 0.2, 0.3);
        bigD.setAttribute("opacity", dOn); bigDs.setAttribute("opacity", dOn);
        const pu = ((t - Tf("delhi", 0.3)) % 1.2) / 1.2;
        ring.setAttribute("r", t > Tf("delhi", 0.3) && t < T("swiss") ? delhi.r + 40 * pu : 0);
        ring.setAttribute("opacity", 1 - pu);
        CO.setAttribute("opacity", F(t, T("swiss") - 0.1, 1e9, 0.3));
        arcs.forEach((a, i) => {
          if (!a.len) a.len = a.p.getTotalLength();
          const u = E.io2((t - T("swiss", 0.2 + i * 0.35)) / 0.9);
          a.p.setAttribute("stroke-dasharray", `${a.len * u} ${a.len}`);
        });

        // F: dollars
        DL.setAttribute("opacity", F(t, T("dollar") - 0.1, T("decide") - 0.25, 0.3));
        dV.textContent = `$${(N.usd_bn * E.io2((t - Tf("dollar", 0.15)) / (0.5 * dur("dollar")))).toFixed(1)} BN`;

        // G: the date, the three schemes, the two plans, the target
        PL.setAttribute("opacity", F(t, T("decide") - 0.1, 1e9, 0.3));
        const up = E.io2((t - T("same", 0.0)) / 0.6);
        date.setAttribute("y", L(620, 430, up)); date.setAttribute("font-size", L(200, 110, up));
        date.setAttribute("opacity", F(t, T("decide") - 0.1, T("planA") - 0.1, 0.3));
        tags.forEach((g, i) => {
          g.setAttribute("opacity", F(t, T("same", 0.4 + i * 0.25), T("planA") - 0.1, 0.25) * (i === 2 && t > Tf("same", 0.7) ? 0.35 : 1));
        });
        const ca = E.o3((t - T("planA", 0.05)) / 0.6), cb = E.o3((t - T("planB", 0.05)) / 0.6);
        cA.setAttribute("opacity", ca); cA.setAttribute("transform", `translate(${(1 - ca) * -60},0)`);
        cB.setAttribute("opacity", cb); cB.setAttribute("transform", `translate(${(1 - cb) * 60},0)`);
        const tg = F(t, Tf("target", 0.55), 1e9, 0.3);
        LK.setAttribute("opacity", tg); tgt.setAttribute("opacity", tg); arA.setAttribute("opacity", tg); arB.setAttribute("opacity", tg);
        $("illus").style.opacity = Math.max(F(t, 0.4, T("mines") - 0.3, 0.4), tg);

        // ledger row and source line
        let rowA = 0;
        for (const [a2, b2, cells] of ROWS) {
          const f = F(t, T(a2, 0.3), T(b2) - 0.15, 0.3);
          if (f > 0) { rowA = f; cells.forEach((c, i) => ($(`r${i}`).textContent = c)); }
        }
        $("row").style.opacity = rowA;
        $("row").style.transform = `translateY(${(1 - rowA) * 30}px)`;
        let sA = 0;
        for (const [a2, b2, s] of SRCS) { const f = F(t, T(a2, 0.4), b2 ? T(b2) - 0.2 : 1e9, 0.3); if (f > 0) { sA = f; $("src").textContent = s; } }
        $("src").style.opacity = rowA > 0 ? 0 : sA;
      };
      H.ready();
    </script>
  </body>
</html>
