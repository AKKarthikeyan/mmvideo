<!doctype html>
<!-- Line-chart beat: a price line that draws itself, then labelled marks. Every number comes from story.js,
     which tools/namakkal_lines.py builds from the NECC CSVs. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <title>Price line</title>
    <script src="assets/lib/gsap.min.js"></script>
    <script src="assets/lib/hf.js"></script>
    <script src="story.js"></script>
    <link rel="stylesheet" href="assets/css/base.css" />
    <style>
      #root { background: radial-gradient(1300px 820px at 50% 40%, #16202e 0%, #0b0f16 62%, #06080c 100%); }
      #chart { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; }
      .axis { font: 400 26px Plex, monospace; fill: #8d98a6; }
      .unit { font: 600 26px Inter, sans-serif; fill: #b9c0c8; letter-spacing: 0.04em; }
      .grid { stroke: rgba(185, 192, 200, 0.14); stroke-width: 2; }
      .base { stroke: rgba(185, 192, 200, 0.45); stroke-width: 3; }
      .line { fill: none; stroke: #7fd1ff; stroke-width: 6; stroke-linejoin: round; stroke-linecap: round;
        filter: drop-shadow(0 0 10px rgba(127, 209, 255, 0.55)); }
      .area { fill: url(#fade); }
      .band { opacity: 0; }
      .band.low { fill: rgba(127, 209, 255, 0.10); }
      .band.high { fill: rgba(217, 164, 65, 0.13); }
      .legend { font: 600 26px Inter, sans-serif; }
      .mk { position: absolute; transform: translate(-50%, -100%); white-space: nowrap; text-align: center; opacity: 0; }
      .mk .v { font: 700 64px/1 Oswald, sans-serif; color: #f7f3ea; }
      .mk .d { font: 400 28px/1.25 Inter, sans-serif; color: #b9c0c8; margin-top: 6px; }
      .mk.gold .v { color: #d9a441; }
      .mk.red .v { color: #ff6a55; }
      .mk.below { transform: translate(-50%, 0); }
      .mk.left { transform: translate(-100%, -50%); text-align: right; }
      .mk.right { transform: translate(0, -50%); text-align: left; }
      .note { position: absolute; left: 110px; bottom: 112px; font: 26px/1.3 Plex, monospace; color: #8d98a6; }
    </style>
  </head>
  <body>
    <div id="root" class="night" data-composition-id="main" data-start="0" data-duration="16.1" data-width="1920" data-height="1080">
      <svg id="chart" viewBox="0 0 1920 1080">
        <defs>
          <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="rgba(127, 209, 255, 0.28)" />
            <stop offset="1" stop-color="rgba(127, 209, 255, 0)" />
          </linearGradient>
        </defs>
        <g id="bands"></g>
        <g id="grid"></g>
        <path id="area" class="area" d="" />
        <path id="line" class="line" d="" />
        <g id="dots"></g>
        <circle id="head" r="11" fill="#f7f3ea" />
      </svg>
      <div id="marks"></div>
      <div id="vig" data-layout-ignore></div>
      <div id="grain" data-layout-ignore></div>
      <div class="kicker" id="kicker"></div>
      <div class="head" id="title"></div>
      <div class="note" id="note"></div>
      <div class="src" id="src"></div>
      <div class="cap" id="cap"></div>
    </div>
    <script>
      const S = window.STORY;
      const H = HF.setup(S.dur), E = HF.ease, F = HF.fade, L = HF.lerp;
      window.__timelines.main = H.tl;
      const $ = (id) => document.getElementById(id);
      const NS = "http://www.w3.org/2000/svg";
      const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
      $("kicker").textContent = S.kicker; $("title").textContent = S.head;
      $("src").textContent = S.src; $("note").textContent = S.note || "";

      // plot box
      const X0 = 230, X1 = 1790, Y0 = 330, Y1 = 830;
      const px = (x) => L(X0, X1, (x - S.x0) / (S.x1 - S.x0));
      const py = (y) => L(Y1, Y0, (y - S.y0) / (S.y1 - S.y0));
      const g = $("grid");
      for (let y = S.y0; y <= S.y1 + 1e-9; y += S.ystep) {
        el("line", { x1: X0, x2: X1, y1: py(y), y2: py(y), class: y === S.y0 ? "base" : "grid" }, g);
        el("text", { x: X0 - 22, y: py(y) + 9, "text-anchor": "end", class: "axis" }, g).textContent = "₹" + y.toFixed(2);
      }
      el("text", { x: X0 - 22, y: Y0 - 34, "text-anchor": "end", class: "unit" }, g).textContent = S.unit;
      for (const k of S.xticks) {
        el("line", { x1: px(k.x), x2: px(k.x), y1: Y1, y2: Y1 + 14, class: "base" }, g);
        el("text", { x: px(k.x), y: Y1 + 50, "text-anchor": "middle", class: "axis" }, g).textContent = k.label;
      }
      const bands = (S.bands || []).map((b) => el("rect", { x: px(b.x0), y: Y0, width: px(b.x1) - px(b.x0), height: Y1 - Y0, class: "band " + b.kind }, $("bands")));
      (S.legend || []).forEach((k, i) => {
        el("rect", { x: X0 + i * 420, y: Y0 - 58, width: 30, height: 30, class: "band " + k.kind, style: "opacity:1" }, $("bands"));
        el("text", { x: X0 + i * 420 + 44, y: Y0 - 34, class: "legend", fill: "#b9c0c8" }, $("bands")).textContent = k.label;
      });
      // the series may have gaps (null y): each run of points is drawn as its own segment
      const segs = []; let cur = [];
      for (const [x, y] of S.series) { if (y === null) { if (cur.length) segs.push(cur); cur = []; } else cur.push([px(x), py(y)]); }
      if (cur.length) segs.push(cur);
      const dots = (S.dots || []).map((d) => el("circle", { cx: px(d.x), cy: py(d.y), r: 12, fill: "#d9a441", stroke: "#0b0e13", "stroke-width": 4, opacity: 0 }, $("dots")));
      const marks = (S.marks || []).map((m) => {
        const div = document.createElement("div");
        div.className = "mk " + (m.cls || "");
        div.style.left = px(m.x) + (m.dx || 0) + "px"; div.style.top = py(m.y) + (m.dy || 0) + "px";
        div.innerHTML = `<div class="v">${m.v}</div><div class="d">${m.d || ""}</div>`;
        $("marks").appendChild(div);
        return div;
      });

      const T0 = 0.8, T1 = S.draw;               // the line draws from T0 to T1
      const sx = S.series.filter((p) => p[1] !== null).map((p) => p[0]);
      const xmin = Math.min(...sx), xmax = Math.max(...sx);
      H.render = (t) => {
        const cut = px(L(xmin, xmax, E.io2((t - T0) / (T1 - T0))));
        let d = "", a = "", last = null;
        for (const s of segs) {
          const pts = [];
          for (let i = 0; i < s.length; i++) {
            if (s[i][0] <= cut) pts.push(s[i]);
            else { if (i > 0) { const p = s[i - 1], q = s[i], u = (cut - p[0]) / (q[0] - p[0]); pts.push([cut, L(p[1], q[1], u)]); } break; }
          }
          if (pts.length < 2) continue;
          const path = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
          d += path + " ";
          a += path + ` L${pts[pts.length - 1][0].toFixed(1)} ${Y1} L${pts[0][0].toFixed(1)} ${Y1} Z `;
          last = pts[pts.length - 1];
        }
        $("line").setAttribute("d", d); $("area").setAttribute("d", a);
        const hv = last && t < T1 + 0.4 ? F(t, T0, T1, 0.4) : 0;
        if (last) { $("head").setAttribute("cx", last[0]); $("head").setAttribute("cy", last[1]); }
        $("head").setAttribute("opacity", hv);
        bands.forEach((b, i) => (b.style.opacity = F(t, S.bands[i].at, 99, 0.6)));
        dots.forEach((c, i) => c.setAttribute("opacity", F(t, S.dots[i].at, 99, 0.3)));
        marks.forEach((m, i) => {
          const u = F(t, S.marks[i].at, 99, 0.45);
          m.style.opacity = u; m.style.marginTop = (1 - E.o3(u)) * 18 + "px";
        });
        let c = ""; for (const k of S.caps) if (t >= k.at) c = k.text;
        $("cap").textContent = c;
        $("cap").style.opacity = c ? F(t, S.caps[0].at, 99, 0.3) : 0;
        $("kicker").style.opacity = F(t, 0.1, 99, 0.5);
        $("title").style.opacity = F(t, 0.25, 99, 0.6);
        $("src").style.opacity = F(t, 0.5, 99, 0.6); $("note").style.opacity = F(t, 0.5, 99, 0.6);
      };
      H.ready();
    </script>
  </body>
</html>
